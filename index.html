.btn{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--teal2);color:var(--teal)}

table{width:100%;border-collapse:collapse;font-size:14px}

/* ---------- policy texts ---------- */

  privacy: tr => tr(
`<h2>سياسة الخصوصية</h2>
<p class="muted small">آخر تحديث: أكتوبر 2026 — تنطبق على جميع أنظمة فيرست براند.</p>

<h3>أين تُحفظ</h3>
<p>على خوادم Supabase السحابية، مشفّرة أثناء النقل (HTTPS) وأثناء التخزين. الملفات في مساحة خاصة لا تُفتح إلا عبر رابط مؤقت ينتهي خلال دقائق.</p>
<h3>كلمات المرور</h3>
<p>تُحفظ مشفّرة باتجاه واحد، ولا يستطيع أحد الاطلاع عليها — ولا الإدارة ولا مدير النظام.</p>
<h3>المشاركة والمدة</h3>
<p>لا نبيع بياناتك ولا نشاركها مع أي جهة تجارية. تُحفظ السجلات طوال فترة العمل وللمدة التي يتطلبها نظام العمل السعودي بعدها.</p>`,
`<h2>Privacy policy</h2>
<p class="muted small">Last updated: October 2026 — applies to all First Brand systems.</p>
<h3>What we store</h3>
<ul><li>Account data: name, email, mobile number, optional profile photo.</li>
<li>Employment data: branch, job title, employee code, transfer history.</li>

<li>A leave request is seen only by those who approve it: pharmacy manager, then HR, then supervisor, then CEO.</li>
<li>Your salary is seen only by you and whoever holds the Payroll permission.</li>

<p>We don't sell your data or share it with any commercial party. Records are kept for the duration of employment and for the period Saudi labour law requires afterwards.</p>`),

`<h2>الأمان وحماية البيانات</h2>

/* ================= TEAM ================= */
function Team({tr,D,reload,toast,lang}){
  const {branches,pharmacists}=D;
  const [nb,setNb]=useState(""); const [np,setNp]=useState({}); const [sel,setSel]=useState("all"); const [mv,setMv]=useState({});
  const titles=[["community pharmacist",tr("صيدلي","Community pharmacist")],["pharmacy manager",tr("مدير صيدلية","Pharmacy manager")],["supervisor",tr("مشرف","Supervisor")],["management",tr("إدارة","Management")]];
  // next employee code, generated from the highest existing one
  const codes=pharmacists.map(p=>String(p.emp_code||"").trim()).filter(c=>/^\d+$/.test(c));
  const width=Math.max(3,...codes.map(c=>c.length));
  const nextCode=String(codes.length?Math.max(...codes.map(Number))+1:1).padStart(width,"0");
  const run=async q=>{ const r=await q; toast(r.error?r.error.message:tr("تم الحفظ","Saved"), !!r.error); reload(); return r; };
  const addBranch=()=>{ if(!nb.trim()) return; run(sb.from("branches").insert({name:nb.trim()})); setNb(""); };
  const removeBranch=b=>{ if(pharmacists.some(p=>p.branch_id===b.id)) return toast(tr("انقل أو احذف صيادلة الفرع أولًا","Move or remove its pharmacists first"),true);
    if(confirm(tr("حذف ","Remove ")+b.name+"?")) run(sb.from("branches").delete().eq("id",b.id)); };
  const addPh=async bid=>{ const f=np[bid]||{}; if(!f.name||!f.name.trim()) return;
    const r=await sb.from("pharmacists").insert({full_name:f.name.trim(),emp_code:nextCode,title:f.title||(bid==="none"?"management":"community pharmacist"),branch_id:bid==="none"?null:bid}).select().single();
    if(r.error) return toast(r.error.message,true);
    if(bid!=="none") await sb.from("pharmacist_assignments").insert({pharmacist_id:r.data.id,branch_id:bid,from_date:today()});
    toast(tr("تمت الإضافة برقم وظيفي ","Added with employee code ")+nextCode); setNp({...np,[bid]:{}}); reload(); };
  const removePh=p=>{ if(confirm(tr("حذف؟ ستُحذف كل بياناته.","Remove? All their data will be deleted."))) run(sb.from("pharmacists").delete().eq("id",p.id)); };
  const move=async p=>{ const m=mv[p.id]||{}; const to=m.branch; const from=today(); if(!to||to===p.branch_id) return;
    const prev=new Date(from+"T00:00:00Z"); prev.setUTCDate(prev.getUTCDate()-1);
    await sb.from("pharmacist_assignments").update({to_date:prev.toISOString().slice(0,10)}).eq("pharmacist_id",p.id).is("to_date",null);
    await run(sb.from("pharmacist_assignments").insert({pharmacist_id:p.id,branch_id:to,from_date:from})); setMv({...mv,[p.id]:{}}); };
  const updPh=(id,patch)=>run(sb.from("pharmacists").update(patch).eq("id",id));
  const shown = sel==="all"? branches : branches.filter(b=>b.id===sel);
  const groups=[...shown.map(b=>({id:b.id,name:b.name,list:pharmacists.filter(p=>p.branch_id===b.id)})), ...(sel==="all"?[{id:"none",name:tr("بدون فرع","No branch"),list:pharmacists.filter(p=>!p.branch_id)}]:[])];
  return <div className="grid">
    <div className="card grid"><h2>{tr("الفروع","Branches")}</h2>
      <div className="row">{branches.map(b=><span key={b.id} className="chip" style={{padding:"6px 10px",fontSize:13,cursor:"pointer",background:sel===b.id?"var(--teal)":"",color:sel===b.id?"#fff":""}} onClick={()=>setSel(sel===b.id?"all":b.id)}>
          {b.name} <span style={{opacity:.7}}>({pharmacists.filter(p=>p.branch_id===b.id).length})</span>
          <button onClick={e=>{e.stopPropagation();removeBranch(b);}} style={{background:"transparent",border:0,cursor:"pointer",color:"inherit",marginInlineStart:6}}>×</button></span>)}
        <span className="chip" style={{padding:"6px 10px",fontSize:13,cursor:"pointer",background:sel==="all"?"var(--teal)":"#EDF1EF",color:sel==="all"?"#fff":"var(--muted)"}} onClick={()=>setSel("all")}>{tr("كل الفروع","All branches")}</span></div>
      <div className="row"><input placeholder={tr("اسم فرع جديد","New branch name")} value={nb} onChange={e=>setNb(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addBranch()} style={{maxWidth:280}}/><button className="btn sec" onClick={addBranch}>{tr("إضافة","Add")}</button></div></div>
    {groups.map(g=><div key={g.id} className="card">

/* ================= ACCOUNTS ================= */
function Accounts({tr,me,D,toast}){
  const {branches,pharmacists}=D; const [profiles,setProfiles]=useState([]);
  const load=useCallback(async()=>{ const r=await sb.from("profiles").select("*").order("created_at",{ascending:false}); setProfiles(r.data||[]); },[]);
  useEffect(()=>{ load(); },[load]);
  const upd=async(id,patch)=>{ const r=await sb.from("profiles").update(patch).eq("id",id); toast(r.error?r.error.message:tr("تم الحفظ","Saved"), !!r.error); load(); };
  const takenBy=pid=>profiles.find(p=>p.pharmacist_id===pid);
  const pages=[["dash",tr("لوحة المتابعة","Dashboard")],["visits",tr("نموذج الزيارة","Visit form")],["visitReports",tr("تقارير الزيارات","Visit reports")],["data",tr("البيانات","Data")],["targets",tr("الأهداف","Targets")]];
  const del=async p=>{ if(p.id===me.id) return;
    if(!confirm(tr("حذف حساب "+p.full_name+"؟ سيفقد الدخول نهائيًا.","Delete the account of "+p.full_name+"? They will lose access permanently."))) return;
    const r=await sb.from("profiles").delete().eq("id",p.id);
    toast(r.error?r.error.message:tr("تم حذف الحساب — احذفه أيضًا من Supabase ← Authentication","Account deleted — also delete it in Supabase → Authentication"), !!r.error); load(); };
  return <div className="grid">
    <div className="muted small">{tr("هنا يتم ربط حسابات الدخول بسجلات الصيادلة وتحديد تبويبات مؤشرات الأداء. صلاحيات الموارد البشرية تُضبط داخل صفحة الموارد البشرية.","Login accounts are linked to pharmacist records here, and KPI tabs are set here. HR permissions are set inside the HR page.")}</div>
    <div className="card tw">
      <table><thead><tr><th>{tr("الاسم","Name")}</th><th>{tr("البريد","Email")}</th><th>{tr("الدور","Role")}</th><th>{tr("الصيدلي المرتبط","Linked pharmacist")}</th><th>{tr("تبويبات مؤشرات الأداء","KPI tabs")}</th><th>{tr("النطاق","Scope")}</th><th>{tr("مدير النظام","Super admin")}</th><th>{tr("الحالة","Status")}</th><th></th></tr></thead><tbody>
        {profiles.map(p=>{ const linked=pharmacists.find(x=>x.id===p.pharmacist_id); return <tr key={p.id}>
          <td>{p.full_name}{!p.pharmacist_id&&p.role==="pharmacist"&&<div><span className="chip bad">{tr("غير مرتبط","Unlinked")}</span></div>}</td>
          <td className="small" dir="ltr">{p.email||"—"}</td>
          <td><select value={p.role} disabled={p.id===me.id} onChange={e=>upd(p.id,{role:e.target.value})}>
            <option value="pharmacist">{tr("صيدلي","Pharmacist")}</option><option value="supervisor">{tr("مشرف","Supervisor")}</option><option value="admin">{tr("إدارة","Management")}</option></select></td>
          <td><select value={p.pharmacist_id||""} onChange={e=>upd(p.id,{pharmacist_id:e.target.value||null})}>
            <option value="">{tr("— غير مرتبط —","— not linked —")}</option>
            {pharmacists.map(x=>{ const tb=takenBy(x.id); return <option key={x.id} value={x.id} disabled={tb&&tb.id!==p.id}>{x.full_name} — {bname(branches,x.branch_id)}</option>; })}</select>
            {linked&&<div className="muted small">{bname(branches,linked.branch_id)}</div>}</td>
          <td><div className="row" style={{gap:8}}>{pages.map(([k,l])=><label key={k} className="check small"><input type="checkbox" checked={(p.pages||[]).includes(k)} disabled={p.is_super&&p.role==="admin"} onChange={e=>{ const cur=(p.pages||[]).filter(x=>x!==k); upd(p.id,{pages:e.target.checked?[...cur,k]:cur}); }}/>{l}</label>)}</div></td>
          <td>{p.role==="supervisor"? <select value={p.branch_id||""} onChange={e=>upd(p.id,{branch_id:e.target.value||null})}><option value="">{tr("كل الفروع","All branches")}</option>{branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}</select> : <span className="muted">—</span>}</td>
          <td>{p.role==="admin"? <input type="checkbox" checked={!!p.is_super} disabled={p.id===me.id} onChange={e=>upd(p.id,{is_super:e.target.checked})}/> : <span className="muted">—</span>}</td>
          <td><label className="check"><input type="checkbox" checked={p.active} disabled={p.id===me.id} onChange={e=>upd(p.id,{active:e.target.checked})}/>{tr("فعّال","Active")}</label></td>
          <td>{p.id!==me.id && <button className="btn warn" style={{padding:"5px 10px"}} onClick={()=>del(p)}>{tr("حذف","Delete")}</button>}</td></tr>; })}
      </tbody></table></div>
  </div>;
}

/* ================= HR PERMISSIONS ================= */
function HrRoles({tr,toast}){
  const [people,setPeople]=useState([]); const [roles,setRoles]=useState({}); const [q,setQ]=useState("");
  const load=useCallback(async()=>{
    const [pe,ro]=await Promise.all([sb.rpc("hr_people"), sb.from("hr_roles").select("*")]);
    setPeople(pe.data||[]); const m={}; (ro.data||[]).forEach(r=>m[r.profile_id]=r); setRoles(m);
  },[]);
  useEffect(()=>{ load(); },[load]);
  const cur=pid=>({is_hr:!!(roles[pid]&&roles[pid].is_hr), is_ceo:!!(roles[pid]&&roles[pid].is_ceo),
    pages: (roles[pid]&&Array.isArray(roles[pid].pages)) ? roles[pid].pages : TAB_DEFAULT});
  const save=async(pid,patch)=>{ const r={profile_id:pid,...cur(pid),...patch};
    const {error}=await sb.from("hr_roles").upsert(r,{onConflict:"profile_id"});
    toast(error?error.message:tr("تم الحفظ","Saved"), !!error); load(); };
  const setHr=(pid,v)=>{ const pg=new Set(cur(pid).pages); if(v) ["approvals",...STAFF_TABS].forEach(k=>pg.add(k)); else STAFF_TABS.forEach(k=>pg.delete(k)); save(pid,{is_hr:v,pages:[...pg]}); };
  const setCeo=(pid,v)=>{ const pg=new Set(cur(pid).pages); if(v) pg.add("approvals"); save(pid,{is_ceo:v,pages:[...pg]}); };
  const setTab=(pid,k,v)=>{ const pg=new Set(cur(pid).pages); v?pg.add(k):pg.delete(k); save(pid,{pages:[...pg]}); };
  const list=people.filter(p=>!q || (p.full_name||"").toLowerCase().includes(q.toLowerCase()) || (p.branch||"").toLowerCase().includes(q.toLowerCase()));
  const cb={width:18,height:18};
  return <div className="card">
    <div className="row" style={{justifyContent:"space-between",marginBottom:6}}>
      <h2 style={{margin:0}}>{tr("صلاحيات الموارد البشرية","HR permissions")}</h2>
      <input style={{maxWidth:220}} placeholder={tr("بحث بالاسم أو الفرع","Search name or branch")} value={q} onChange={e=>setQ(e.target.value)}/>
    </div>
    <p className="small muted" style={{marginTop:0}}>{tr(
      "الموظف يرى بياناته فقط في «إجازاتي» و«طلباتي» و«راتبي». التبويبات المظللة تفتح بيانات كل الموظفين. مدير الصيدلية والمشرف يُحدَّدان تلقائيًا من المسمى الوظيفي.",
      "Employees only ever see their own data in My leave, My requests and My salary. The shaded tabs open everyone's data. Pharmacy manager and supervisor come automatically from the job title.")}</p>
    <div className="tw"><table>
      <thead><tr><th>{tr("الحساب","Account")}</th><th>{tr("موارد بشرية","HR")}</th><th>{tr("رئيس تنفيذي","CEO")}</th>
        {TAB_KEYS.map(k=><th key={k} style={{background:STAFF_TABS.includes(k)?"var(--amber2)":undefined}}>{hrTabName(tr,k)}</th>)}</tr></thead>
      <tbody>{list.map(p=>{ const c=cur(p.id); return <tr key={p.id}>
        <td>{p.full_name}<div className="small muted">{[p.title,p.branch].filter(Boolean).join(" / ")||"—"}</div></td>
        <td><input type="checkbox" style={cb} checked={c.is_hr} onChange={e=>setHr(p.id,e.target.checked)}/></td>
        <td><input type="checkbox" style={cb} checked={c.is_ceo} onChange={e=>setCeo(p.id,e.target.checked)}/></td>
        {TAB_KEYS.map(k=><td key={k} style={{textAlign:"center",background:STAFF_TABS.includes(k)?"#FFFBF2":undefined}}>
          <input type="checkbox" style={cb} checked={c.pages.includes(k)} onChange={e=>setTab(p.id,k,e.target.checked)}/></td>)}
      </tr>; })}</tbody>
    </table></div>
  </div>;
}

/* ================= APPEARANCE ================= */
function Appearance({tr,brand,setBrand,toast}){
  const [busy,setBusy]=useState(false);
  const save=async next=>{
    setBrand(next); applyBrand(next);
    const {error}=await sb.from("app_settings").upsert({key:"brand",value:next,updated_at:new Date().toISOString()},{onConflict:"key"});
    if(error) toast(error.message,true); else toast(tr("تم الحفظ للجميع","Saved for everyone"));
  };
  const upLogo=async e=>{
    const file=e.target.files[0]; if(!file) return;
    if(file.size>2*1024*1024) return toast(tr("حجم الشعار أكبر من 2 ميجابايت","The logo is larger than 2 MB"),true);
    setBusy(true);
    const ext=(file.name.split(".").pop()||"png").toLowerCase();
    const path="logo_"+Date.now()+"."+ext;
    const up=await sb.storage.from("brand").upload(path,file,{upsert:true,contentType:file.type});
    if(up.error){ setBusy(false); return toast(up.error.message,true); }
    const url=sb.storage.from("brand").getPublicUrl(path).data.publicUrl;
    await save({...brand,logo_url:url}); setBusy(false); e.target.value="";
  };
  return <div className="grid">
    <div className="card">
      <h2>{tr("لون المنصة","Platform colour")}</h2>
      <div className="row" style={{gap:10}}>
        {Object.keys(THEMES).map(k=><button key={k} className="btn sec" onClick={()=>save({...brand,preset:k})}
          style={{display:"flex",alignItems:"center",gap:8,border:(brand.preset===k?"2px solid "+THEMES[k][0]:"2px solid transparent")}}>
          <span style={{width:18,height:18,borderRadius:"50%",background:THEMES[k][0],display:"inline-block"}}/>{themeName(tr,k)}</button>)}
      </div>
      <div className="row" style={{marginTop:14,alignItems:"flex-end"}}>
        <label className="f" style={{maxWidth:180}}>{themeName(tr,"custom")}
          <input type="color" value={brand.primary||"#0F6B63"} onChange={e=>setBrand({...brand,preset:"custom",primary:e.target.value})}/></label>
        <button className="btn" onClick={()=>save({...brand,preset:"custom"})}>{tr("تطبيق اللون المخصص","Apply custom colour")}</button>
      </div>
    </div>
    <div className="card">
      <h2>{tr("شعار الشركة","Company logo")}</h2>
      <div className="row" style={{gap:16}}>
        <div style={{width:120,height:120,borderRadius:14,background:"var(--teal2)",display:"grid",placeItems:"center",overflow:"hidden"}}>
          {brand.logo_url ? <img src={brand.logo_url} alt="" style={{maxWidth:"100%",maxHeight:"100%",objectFit:"contain"}}/> : <span className="muted small">{tr("لا يوجد شعار","No logo")}</span>}
        </div>
        <div className="grid" style={{gap:8}}>
          <label className="btn sec" style={{cursor:"pointer",display:"inline-block"}}>{tr("رفع شعار","Upload logo")}
            <input type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp" onChange={upLogo} disabled={busy} style={{display:"none"}}/></label>
          {brand.logo_url && <button className="btn warn" onClick={()=>save({...brand,logo_url:null})}>{tr("إزالة الشعار","Remove logo")}</button>}
          <span className="small muted">{tr("PNG أو SVG بخلفية شفافة، حتى 2 ميجابايت","PNG or SVG with a transparent background, up to 2 MB")}</span>
        </div>
      </div>
    </div>
  </div>;
}

/* ================= APP ================= */
function App(){
  const [lang,setLang]=useState(()=>{ try{ return localStorage.getItem("lang")||"ar"; }catch(e){ return "ar"; } });
  const tr=useCallback((ar,en)=>lang==="ar"?ar:en,[lang]);
  const [session,setSession]=useState(undefined);
  const [me,setMe]=useState(null);
  const [D,setD]=useState(null);
  const [admin,setAdmin]=useState("");      // "", team, accounts, kpi
  const [doc,setDoc]=useState("");          // policy modal
  const [brand,setBrand]=useState({preset:"teal",primary:"#0F6B63",logo_url:null});
  const [msg,setMsg]=useState(null);
  const [f,setF]=useState({email:"",pass:""}); const [err,setErr]=useState(""); const [ok,setOk]=useState(""); const [busy,setBusy]=useState(false);
  const toast=useCallback((text,bad)=>{ setMsg({text,bad}); clearTimeout(window.__t); window.__t=setTimeout(()=>setMsg(null),3000); },[]);

  useEffect(()=>{ document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr"; try{ localStorage.setItem("lang",lang); }catch(e){} },[lang]);
  useEffect(()=>{ sb.from("app_settings").select("value").eq("key","brand").maybeSingle()
      .then(({data})=>{ if(data&&data.value){ setBrand(data.value); applyBrand(data.value); } }); },[]);
  useEffect(()=>{ sb.auth.getSession().then(({data})=>setSession(data.session||null));
    const {data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s)); return ()=>sub.subscription.unsubscribe(); },[]);
  useEffect(()=>{ if(!session){ setMe(null); setD(null); return; }
    (async()=>{ const r=await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle(); setMe(r.data||null); })(); },[session]);

  const reload=useCallback(async()=>{
    const [b,p,a]=await Promise.all([
      sb.from("branches").select("*").eq("active",true).order("name"),
      sb.from("pharmacists").select("*").order("full_name"),
      sb.from("pharmacist_assignments").select("*")]);
    setD({branches:b.data||[],pharmacists:p.data||[],assignments:a.data||[]});
  },[]);
  useEffect(()=>{ if((admin==="team"||admin==="accounts") && !D) reload(); },[admin,D,reload]);

  const signIn=async()=>{ setBusy(true); setErr(""); const r=await sb.auth.signInWithPassword({email:f.email.trim(),password:f.pass}); setBusy(false); if(r.error) setErr(r.error.message); else setF({email:"",pass:""}); };
  const forgot=async()=>{ if(!f.email.trim()) return setErr(tr("اكتب بريدك الإلكتروني أولًا","Type your email first"));
    const base=location.href.split("?")[0].replace(/index\.html$/,"");
    const r=await sb.auth.resetPasswordForEmail(f.email.trim(),{redirectTo:base+"hr.html"});
    if(r.error) setErr(r.error.message); else { setErr(""); setOk(tr("أرسلنا رابط تعيين كلمة المرور إلى بريدك","We sent a password reset link to your email")); } };

  const isSuper = !!(me && me.is_super);
  const name = me ? me.full_name : (session ? session.user.email : "");
  const Card=({href,ic,title,sub,onClick,soon,on})=> {

  };

    <header><div className="in">

        <span>First Brand <small>{tr("منصة الشركة","Company platform")}</small></span></div>

      {session && <button onClick={()=>{ setAdmin(""); sb.auth.signOut(); }}>{tr("خروج","Sign out")}</button>}

      <p className="muted">{tr("اختر النظام الذي تريد فتحه","Choose the system you want to open")}</p>

      <div className="apps">

        <Card href="./hr.html" ic="HR" title={tr("الموارد البشرية","HR")} sub={tr("الإجازات، الطلبات الإدارية، والرواتب","Leave, service requests and salaries")}/>
        <Card ic="MK" title={tr("التسويق","Marketing")} sub={tr("العروض والحملات — قيد الإعداد","Offers and campaigns — in progress")} soon/>
        {isSuper && <Card ic="⚙" title={tr("الإدارة","Admin")} sub={tr("الفروع والفريق، الحسابات والصلاحيات، المظهر والشعار","Branches and team, accounts and permissions, look and logo")} on={!!admin} onClick={()=>setAdmin(admin?"":"team")}/>}
      </div>

      {!session && <section className="card signin">
        <h2 style={{margin:0}}>{tr("تسجيل الدخول","Sign in")}</h2>

        <label>{tr("البريد الإلكتروني","Email")}<input type="email" dir="ltr" value={f.email} onChange={e=>setF({...f,email:e.target.value})}/></label>

      {isSuper && admin && <section>
        <div className="subtabs">
          <button className={admin==="team"?"on":""} onClick={()=>setAdmin("team")}>{tr("الفروع والفريق","Branches & team")}</button>

      <button onClick={()=>setDoc("security")}>{tr("الأمان","Security")}</button>
      <button onClick={()=>setDoc("terms")}>{tr("شروط الاستخدام","Terms of use")}</button>
    </footer>

    {doc && <div className="modal" onClick={e=>e.target===e.currentTarget&&setDoc("")}>
      <div className="box">
        <div className="row" style={{justifyContent:"flex-end"}}><button className="x" onClick={()=>setDoc("")}>×</button></div>
        <div dangerouslySetInnerHTML={{__html:POLICY[doc](tr)}}/>
        <div className="row" style={{marginTop:14}}>
          {["privacy","security","terms"].filter(k=>k!==doc).map(k=><button key={k} className="btn sec" onClick={()=>setDoc(k)}>
            {k==="privacy"?tr("الخصوصية","Privacy"):k==="security"?tr("الأمان","Security"):tr("شروط الاستخدام","Terms of use")}</button>)}
        </div>
      </div></div>}

    {msg && <div className={"toast"} style={msg.bad?{background:"var(--red)"}:null}>{msg.text}</div>}
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
