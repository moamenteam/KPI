<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>First Brand KPI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#F4F7F5; --card:#FFFFFF; --ink:#14383A; --ink-2:#4A6466; --line:#D7E2DE;
    --teal:#1F6F6B; --teal-soft:#E3F1EE; --amber:#E39B2F; --amber-soft:#FBEFD9;
    --good:#2E8B6A; --bad:#C4472B; --bad-soft:#FBE6E0;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.45}
  [dir=rtl] body, body[dir=rtl]{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
  h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--teal)}
  .muted{color:var(--ink-2)}
  .small{font-size:13px}

  /* top bar */
  .bar{background:var(--ink);color:#fff;padding:0 18px;display:flex;align-items:center;gap:18px;height:56px;position:sticky;top:0;z-index:5}
  .brand{font-weight:700;letter-spacing:.02em;white-space:nowrap}
  .brand span{color:var(--amber)}
  .tabs{display:flex;gap:4px;flex:1;overflow:auto}
  .tab{background:transparent;border:0;color:#CFE0DC;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .tab.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
  .bar .who{font-size:13px;color:#CFE0DC;white-space:nowrap}
  .ghost{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}

  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 80px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .g3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}

  /* forms */
  label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);flex:1;min-width:140px}
  input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;width:100%}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
  input[type=number]{font-variant-numeric:tabular-nums}
  .check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);flex:0}
  .check input{width:auto}
  .btn{background:var(--teal);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer}
  .btn.sec{background:var(--teal-soft);color:var(--teal)}
  .btn.warn{background:var(--bad-soft);color:var(--bad)}
  .btn:disabled{opacity:.5;cursor:default}
  .toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9}
  [dir=rtl] .toast{transform:translateX(50%)}
  .err{background:var(--bad-soft);color:var(--bad);border-radius:9px;padding:9px 12px;font-size:14px}

  /* login */
  .login{min-height:100vh;display:grid;place-items:center;padding:20px}
  .login .card{width:100%;max-width:400px;padding:28px}
  .login h1{font-size:22px;margin-bottom:4px}

  /* chips / table */
  .chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--teal-soft);color:var(--teal)}
  .chip.amber{background:var(--amber-soft);color:#8A5A0E}
  .chip.bad{background:var(--bad-soft);color:var(--bad)}
  .chip.grey{background:#EDF1EF;color:var(--ink-2)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:start;font-weight:500;color:var(--ink-2);font-size:13px;padding:8px 6px;border-bottom:1px solid var(--line)}
  td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  td input,td select{padding:6px 8px}

  /* dashboard hero: momentum */
  .hero{display:grid;grid-template-columns:1fr 2fr;gap:14px}
  @media(max-width:720px){.hero{grid-template-columns:1fr}}
  .mo{background:var(--ink);color:#fff;border-radius:var(--r);padding:20px;display:flex;flex-direction:column;justify-content:space-between;min-height:170px}
  .mo .big{font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .mo .big small{font-size:22px;font-weight:500;color:#CFE0DC}
  .delta{font-size:14px;font-weight:600}
  .delta.up{color:#7FD9B5}.delta.down{color:#F59A82}.delta.flat{color:#CFE0DC}
  .strip{display:grid;grid-template-columns:repeat(28,1fr);gap:4px;margin-top:10px}
  .strip i{display:block;height:14px;border-radius:3px;background:#EDF1EF}
  .strip i.on{background:var(--teal)}
  .strip i.today{outline:2px solid var(--amber);outline-offset:-2px}
  .kpi-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .pct{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .pct.good{color:var(--good)}.pct.mid{color:var(--amber)}.pct.bad{color:var(--bad)}
  .bar-track{height:8px;background:#EDF1EF;border-radius:99px;overflow:hidden;margin:10px 0 6px}
  .bar-fill{height:100%;border-radius:99px;background:var(--teal)}
  .bar-fill.good{background:var(--good)}.bar-fill.mid{background:var(--amber)}.bar-fill.bad{background:var(--bad)}
  .spark{width:100%;height:44px;display:block;margin-top:8px}
  .empty{padding:36px;text-align:center;color:var(--ink-2)}
  @media(prefers-reduced-motion:no-preference){.bar-fill{transition:width .5s ease}}
</style>
</head>
<body>
<div id="root" style="padding:40px;color:#4A6466">Loading…</div>
<script>
window.addEventListener("error",e=>{document.getElementById("root").innerHTML='<pre style="padding:20px;color:#C4472B;white-space:pre-wrap">'+(e.message||e.error)+'\n'+(e.filename||'')+':'+(e.lineno||'')+'</pre>'});
window.addEventListener("unhandledrejection",e=>{document.getElementById("root").innerHTML='<pre style="padding:20px;color:#C4472B;white-space:pre-wrap">'+(e.reason&&e.reason.message||e.reason)+'</pre>'});
</script>
<style>
  .score-row{display:grid;grid-template-columns:1.4fr 1fr 70px 90px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .score-row:last-child{border-bottom:0}
  @media(max-width:560px){.score-row{grid-template-columns:1fr 70px 90px}.score-row .sub{display:none}}
  .pts{font-weight:700;font-variant-numeric:tabular-nums;text-align:end}
  .pts small{font-weight:400;color:var(--ink-2)}
  .rank td:first-child{width:36px;color:var(--ink-2)}
  .subtabs{display:flex;gap:6px;flex-wrap:wrap}
  .subtabs button{background:#EDF1EF;border:0;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--ink-2)}
  .subtabs button.on{background:var(--teal);color:#fff}
  .num{font-variant-numeric:tabular-nums;text-align:end}
  .checkrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .checkrow input{width:20px;height:20px;margin-top:2px}
  .na{color:var(--ink-2);font-size:12px}
  pre.csv{white-space:pre-wrap;font-size:12px;background:#EDF1EF;padding:10px;border-radius:9px}
  .vform td input,.vform td select{padding:5px 7px}
  .vform input[readonly]{background:#F4F7F5}
  @media print{ .bar,.noprint,.btn{display:none!important} body{background:#fff} .wrap{max-width:none;padding:0} .card{break-inside:avoid;border-color:#999;margin-bottom:8px;padding:10px} input,select,textarea{border:0;border-bottom:1px solid #999;border-radius:0;padding:2px 4px} h1{font-size:18px} h2{font-size:14px} table{font-size:12px} }

function makeEngine(D){ // D = {kpis, branches, pharmacists, assignments, targets, snaps, visits}
  const tgt=(code,mk,bid,pid)=>{ const q=qOf(mk); const r=D.targets.find(x=>x.kpi_code===code&&x.year===q.year&&x.quarter===q.quarter&&(bid?x.branch_id===bid:x.pharmacist_id===pid)); return r? Number(r["m"+(q.idx+1)]) : null; };

  const kpisFor=mk=>{ const q=qOf(mk); return D.kpis.map(k=>{ const o=(D.schemes||[]).find(x=>x.kpi_code===k.code&&x.year===q.year&&x.quarter===q.quarter); return o? {...k,weight:o.weight,cap:o.cap,threshold:o.threshold??k.threshold,active:o.active} : k; }).sort((a,b)=>a.sort-b.sort); };

  // branch shares for a pharmacist in a month: [{branch_id, share}]
  const shares=(pid,mk)=>{ const start=mk, end=addMonths(mk,1), n=daysInMonth(mk); const out={};
    D.assignments.filter(a=>a.pharmacist_id===pid&&a.from_date<end&&(!a.to_date||a.to_date>=start)).forEach(a=>{
      const f=a.from_date>start?a.from_date:start; const t=a.to_date&&a.to_date<end?addDaysIso(a.to_date,1):end;

    if(k.level==="branch"){ const sh=shares(pid,mk); if(!sh.length) return {ach:null};
      let ach=0, any=false, detail=[]; sh.forEach(x=>{ const r=branchKpi(code,x.branch_id,mk); if(r.ach!=null){ ach+=r.ach*x.share; any=true; } detail.push({...r,...x}); });
      const d0=detail[0]; return any? {ach, actual:d0.actual, target:d0.target, ratio:d0.ratio, asOf:d0.asOf, mixed:sh.length>1} : {ach:null}; }
    if(k.rule==="visit"){ const vs=D.visits.filter(v=>v.pharmacist_id===pid&&monthKey(v.visit_date)===mk); if(!vs.length) return {ach:null};
      const avg=vs.reduce((a,v)=>a+Number(v.score),0)/vs.length; return {ach:avg, actual:avg, target:1, unit:"rate", n:vs.length}; }
    const s=snap(code,mk,null,pid);
    if(k.rule==="rate"){ const t=tgt(code,mk,null,pid)||Number(k.threshold); if(!s||!Number(s.denominator)) return {ach:null,target:t,unit:"rate"};
      const rate=Number(s.numerator)/Number(s.denominator); return {ach:rate/t, actual:rate, target:t, unit:"rate", asOf:s.as_of}; }
    const t=tgt(code,mk,null,pid); if(!s||!t) return {ach:null, actual:s?Number(s.value):null, target:t};
    return {ach:Number(s.value)/t, actual:Number(s.value), target:t, asOf:s.as_of}; }

  const pts=(k,ach)=> ach==null? null : Number(k.weight)*Math.min(ach, k.cap==null?Infinity:Number(k.cap));
  function pharmacistScore(pid,mk){ const rows=kpisFor(mk).filter(k=>k.active).map(k=>{ const r=phKpi(k.code,pid,mk); return {k,...r,pts:pts(k,r.ach)}; });
    const has=rows.filter(r=>r.pts!=null); return {rows, total: has.length? has.reduce((a,r)=>a+r.pts,0):null, covered: has.reduce((a,r)=>a+Number(r.k.weight),0)}; }
  function branchScore(bid,mk){ const phs=D.pharmacists.filter(p=>scored(p)&&shares(p.id,mk).some(s=>s.branch_id===bid));
    const rows=kpisFor(mk).filter(k=>k.active).map(k=>{ if(k.level==="branch"){ const r=branchKpi(k.code,bid,mk); return {k,...r,pts:pts(k,r.ach)}; }
      const vals=phs.map(p=>{ const r=phKpi(k.code,p.id,mk); return pts(k,r.ach); }).filter(v=>v!=null); return {k, ach:null, pts: vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null, n:vals.length}; });
    const has=rows.filter(r=>r.pts!=null); return {rows, total: has.length? has.reduce((a,r)=>a+r.pts,0):null, phs}; }
  function quarterAvg(fn,id,mk){ const q=qOf(mk); const ms=[0,1,2].map(i=>addMonths(mk,i-q.idx)).map(m=>fn(id,m).total).filter(x=>x!=null); return ms.length? ms.reduce((a,b)=>a+b,0)/ms.length : null; }
  return {shares, pharmacistScore, branchScore, quarterAvg, kpisFor};
}

/* ---------- small components ---------- */
function Spark({points}){ const w=300,h=44; const vals=points.map(p=>p??0); const max=Math.max(1,...vals);
  const pt=(v,i)=>`${(i/(points.length-1))*w},${h-4-(v/max)*(h-8)}`;
  return <svg className="spark" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" aria-hidden="true">
    <polyline fill="none" stroke="var(--teal)" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" points={vals.map(pt).join(" ")}/>
    {vals.map((v,i)=><circle key={i} cx={(i/(points.length-1))*w} cy={h-4-(v/max)*(h-8)} r={i===points.length-1?4:2.5} fill={points[i]==null?"#C9D3D0":i===points.length-1?"var(--amber)":"var(--teal)"}/>)}
  </svg>; }
function Toast({msg}){ return msg? <div className="toast">{msg}</div> : null; }
function MonthPicker({mk,set,lang}){ return <div className="row" style={{gap:6}}>
  <button className="btn sec" style={{padding:"6px 10px"}} onClick={()=>set(addMonths(mk,-1))}>‹</button>
  <strong style={{minWidth:150,textAlign:"center"}}>{monthLabel(mk,lang)}</strong>
  <button className="btn sec" style={{padding:"6px 10px"}} onClick={()=>set(addMonths(mk,1))} disabled={mk>=thisMonth()}>›</button></div>; }
function ScoreRows({rows,t,lang}){ return <div>{rows.map(r=>{ const cap=r.k.cap==null?null:Number(r.k.cap); const maxPts=Number(r.k.weight)*(cap??1.5);
  return <div key={r.k.code} className="score-row">
    <div><strong>{kname(r.k,lang)}</strong><div className="muted small">{r.k.level==="branch"?t.branch:t.pharmacist} · {t.weight} {r.k.weight}{r.mixed&&" · ⇄"}</div></div>
    <div className="sub small muted">{r.ach==null? <span className="na">{t.noData}</span> :
      r.k.code==="expire"? <>{fmt(r.actual)} {t.sar} · {(r.ratio*100).toFixed(2)}% {t.ofSales}</> :
      r.k.rule==="visit"? <>{r.n} {t.visits.toLowerCase()} · {fmt(r.actual,"rate")}</> :
      r.ach!=null&&r.actual!=null? <>{fmt(r.actual,r.unit)} / {fmt(r.target,r.unit)}{r.asOf&&<span> · {t.asOf} {r.asOf.slice(5)}</span>}</> : null}</div>
    <div className={"pct "+tone(r.ach)} style={{fontSize:18}}>{r.ach==null?"—":Math.round(r.ach*100)+"%"}</div>
    <div className="pts">{r.pts==null?"—":r.pts.toFixed(1)}<small> / {r.k.weight}</small>
      <div className="bar-track" style={{margin:"4px 0 0"}}><div className={"bar-fill "+tone(r.ach)} style={{width:(r.pts==null?0:Math.min(100,r.pts/maxPts*100))+"%"}}/></div></div>
  </div>; })}</div>; }

/* ================= LOGIN ================= */
function Login({t,lang,setLang}){
  const [mode,setMode]=useState("in"); const [f,setF]=useState({email:"",pass:"",name:""}); const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);
  const go=async()=>{ setBusy(true); setErr(""); const r= mode==="in"? await sb.auth.signInWithPassword({email:f.email,password:f.pass}) : await sb.auth.signUp({email:f.email,password:f.pass,options:{data:{full_name:f.name}}}); if(r.error) setErr(r.error.message); setBusy(false); };
  const set=k=>e=>setF({...f,[k]:e.target.value});
  return <div className="login"><div className="card">
    <div className="row" style={{justifyContent:"space-between",marginBottom:18}}><div className="brand" style={{color:"var(--ink)",fontSize:18}}>{t.app} <span>{t.kpi}</span></div><button className="btn sec" style={{padding:"5px 10px"}} onClick={()=>setLang(lang==="en"?"ar":"en")}>{t.lang}</button></div>

      <label className="f">{t.pass}<input type="password" value={f.pass} onChange={set("pass")} onKeyDown={e=>e.key==="Enter"&&go()} dir="ltr"/></label>
      {err && <div className="err">{err}</div>}
      <button className="btn" disabled={busy} onClick={go}>{mode==="in"?t.login:t.signup}</button>

}

  if(view==="branch"&&bid){ const s=E.branchScore(bid,mk); const prev=E.branchScore(bid,addMonths(mk,-1)).total; rows=s.rows;

  if(view==="company"){ const rank=D.branches.map(b=>({b,s:E.branchScore(b.id,mk),prev:E.branchScore(b.id,addMonths(mk,-1)).total})).sort((a,b)=>(b.s.total??-1)-(a.s.total??-1));
    const has=rank.filter(r=>r.s.total!=null); const total=has.length?has.reduce((a,r)=>a+r.s.total,0)/has.length:null;
    const hasP=rank.filter(r=>r.prev!=null); const prev=hasP.length?hasP.reduce((a,r)=>a+r.prev,0)/hasP.length:null;
    hero={title:t.company, sub:`${D.branches.length} ${t.branches}`, total, prev, q:null};
    sparks=months6.map(m=>{ const v=D.branches.map(b=>E.branchScore(b.id,m).total).filter(x=>x!=null); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; });
    const stars=D.pharmacists.filter(scored).map(p=>({p,q:E.quarterAvg(E.pharmacistScore,p.id,mk)})).filter(x=>x.q!=null).sort((a,b)=>b.q-a.q);
    const curQ=qOf(thisMonth()), selQ=qOf(mk); const starCard=(selQ.year!==curQ.year||selQ.quarter!==curQ.quarter)? null : <div className="card"><div className="row" style={{justifyContent:"space-between"}}><h3>{t.stars} · Q{qOf(mk).quarter} {qOf(mk).year}</h3><span className="muted small">{t.starsHint}</span></div>
      <table className="rank"><tbody>{stars.slice(0,10).map((x,i)=><tr key={x.p.id}><td>{i+1}</td><td>{x.p.full_name}<div className="muted small">{bname(D.branches,x.p.branch_id)}</div></td><td className="num"><strong>{x.q.toFixed(1)}</strong></td><td className="num">{i===0?<span className="chip amber">★ 1,500</span>:i===1?<span className="chip amber">★ 1,000</span>:null}</td></tr>)}</tbody></table></div>;
    extra=<><div className="card"><h3 style={{marginBottom:8}}>{t.ranking} · {t.branches}</h3><table className="rank"><thead><tr><th></th><th>{t.branch}</th>{E.kpisFor(mk).filter(k=>k.active).map(k=><th key={k.code} className="num">{kname(k,lang)}</th>)}<th className="num">{t.score}</th></tr></thead><tbody>
      {rank.map((r,i)=><tr key={r.b.id}><td>{i+1}</td><td><a href="#" onClick={e=>{e.preventDefault();setView("branch");setBid(r.b.id);}}>{r.b.name}</a></td>{r.s.rows.map(x=><td key={x.k.code} className="num">{x.pts==null?"—":x.pts.toFixed(1)}</td>)}<td className="num"><strong>{r.s.total==null?"—":r.s.total.toFixed(1)}</strong></td></tr>)}</tbody></table></div>{starCard}</>; }

  const vBranch = view==="pharmacist"&&pid ? (E.shares(pid,mk)[0]||{}).branch_id : view==="branch"? bid : null;
  const vList = vBranch? D.visits.filter(x=>x.branch_id===vBranch&&monthKey(x.visit_date)===mk) : [];
  const visitCard = vBranch && vList.length>0 ? <div className="card"><h3 style={{marginBottom:8}}>{t.visitResults} · {bname(D.branches,vBranch)}</h3>
    <table><thead><tr><th>{t.date}</th><th>{t.pharmacist}</th><th>{VT[lang].vtype}</th><th className="num">{t.score}</th><th>{VT[lang].decision}</th><th>{VT[lang].priorities}</th></tr></thead><tbody>
    {vList.map(x=><tr key={x.id}><td>{x.visit_date}</td><td>{D.pharmacists.find(p=>p.id===x.pharmacist_id)?.full_name||"—"}</td><td className="small muted">{VT[lang][x.visit_type]||""}</td><td className="num"><span className={"pct "+tone(x.score)} style={{fontSize:15}}>{x.total_points!=null?x.total_points:Math.round(x.score*100)} / 100</span></td><td className="small">{({pass:VT[lang].d1,photos:VT[lang].d2,training:VT[lang].d3,revisit:VT[lang].d4})[x.decision]||""}</td><td className="small muted">{x.priorities}</td></tr>)}</tbody></table></div> : null;
  const delta = hero&&hero.total!=null&&hero.prev!=null? hero.total-hero.prev : null;
  return <div className="grid">
    <div className="row" style={{justifyContent:"space-between"}}><h1>{t.dash}</h1><MonthPicker mk={mk} set={setMk} lang={lang}/></div>
    {isMgr && <div className="row">
      <div className="subtabs">{me.role==="admin"&&<button className={view==="company"?"on":""} onClick={()=>setView("company")}>{t.company}</button>}<button className={view==="branch"?"on":""} onClick={()=>setView("branch")}>{t.branch}</button><button className={view==="pharmacist"?"on":""} onClick={()=>setView("pharmacist")}>{t.pharmacist}</button></div>
      {view!=="company" && (me.role==="admin"||!me.branch_id) && <select value={bid} onChange={e=>setBid(e.target.value)} style={{width:"auto"}}>{view==="pharmacist"&&<option value="">{t.allBranches}</option>}{D.branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}</select>}
      {view==="pharmacist" && <select value={pid} onChange={e=>setPid(e.target.value)} style={{width:"auto"}}>{phPool.map(p=><option key={p.id} value={p.id}>{p.full_name}</option>)}</select>}
    </div>}
    {!hero ? <div className="card empty">{t.noData}</div> : <>
    <div className="hero">
      <div className="mo">
        <div><div className="small" style={{color:"#CFE0DC"}}>{hero.sub}</div><div style={{fontWeight:600,marginTop:6}}>{hero.title}</div></div>
        <div><div className="big">{hero.total==null?"—":hero.total.toFixed(0)}<small> / 100</small></div>
          <div className={"delta "+(delta==null?"flat":delta>0?"up":delta<0?"down":"flat")}>{delta==null?"■ —":(delta>0?"▲ ":delta<0?"▼ ":"■ ")+Math.abs(delta).toFixed(1)} <span style={{fontWeight:400,color:"#CFE0DC"}}>{t.vsPrev}</span>{hero.q!=null&&<span style={{fontWeight:400,color:"#CFE0DC"}}> · {t.qAvg} {hero.q.toFixed(1)}</span>}</div></div>

    </div>
    {view!=="company" && <div className="card"><ScoreRows rows={rows} t={t} lang={lang}/></div>}
    {visitCard}
    {extra}
    </>}
  </div>;
}

/* ================= TARGETS (admin) ================= */
function Targets({t,D,E,reload,toast,lang}){
  const q0=qOf(thisMonth()); const [year,setYear]=useState(q0.year); const [quarter,setQuarter]=useState(q0.quarter); const [tab,setTab]=useState("branch");
  const [edits,setEdits]=useState({}); // key -> {m1,m2,m3}
  useEffect(()=>setEdits({}),[year,quarter,tab]);
  const key=(code,id)=>code+"|"+id;
  const row=(code,bid,pid)=>{ const k=key(code,bid||pid); if(edits[k]) return edits[k]; const r=D.targets.find(x=>x.kpi_code===code&&x.year===year&&x.quarter===quarter&&(bid?x.branch_id===bid:x.pharmacist_id===pid)); return r?{m1:r.m1,m2:r.m2,m3:r.m3}:{m1:"",m2:"",m3:""}; };
  const setCell=(code,id,m,v)=>setEdits({...edits,[key(code,id)]:{...row(code,tab==="branch"?id:null,tab==="branch"?null:id),[m]:v}});
  const split=(code,id)=>{ const tot=Number(prompt(t.qTotal)); if(!tot) return; const v=+(tot/3).toFixed(2); setEdits({...edits,[key(code,id)]:{m1:v,m2:v,m3:v}}); };
  const save=async()=>{ const rows=Object.entries(edits).map(([k,v])=>{ const [code,id]=k.split("|"); return {kpi_code:code,year,quarter,branch_id:tab==="branch"?id:null,pharmacist_id:tab==="branch"?null:id,m1:Number(v.m1)||0,m2:Number(v.m2)||0,m3:Number(v.m3)||0}; });
    if(!rows.length) return; const r=await sb.from("targets").upsert(rows,{onConflict:"kpi_code,year,quarter,branch_id,pharmacist_id"}); toast(r.error?r.error.message:t.saved); if(!r.error){ setEdits({}); reload(); } };
  const kp=E.kpisFor(`${year}-${String((quarter-1)*3+1).padStart(2,"0")}-01`).filter(k=>k.active&&k.level===(tab==="branch"?"branch":"pharmacist")&&k.rule!=="visit"&&k.code!=="expire");
  const subjects= tab==="branch"? D.branches : D.pharmacists.filter(scored);
  const mlabels=[0,1,2].map(i=>new Date(year,(quarter-1)*3+i,1).toLocaleDateString(lang==="ar"?"ar-SA":"en-GB",{month:"short"}));
  return <div className="grid">
    <div className="row" style={{justifyContent:"space-between"}}><h1>{t.targets}</h1><div className="row"><select value={year} onChange={e=>setYear(Number(e.target.value))} style={{width:"auto"}}>{[q0.year-1,q0.year,q0.year+1].map(y=><option key={y}>{y}</option>)}</select><select value={quarter} onChange={e=>setQuarter(Number(e.target.value))} style={{width:"auto"}}>{[1,2,3,4].map(q=><option key={q} value={q}>Q{q}</option>)}</select></div></div>
    <div className="subtabs"><button className={tab==="branch"?"on":""} onClick={()=>setTab("branch")}>{t.branchKpis}</button><button className={tab==="ph"?"on":""} onClick={()=>setTab("ph")}>{t.phKpis}</button></div>
    {kp.map(k=><div key={k.code} className="card"><h2 style={{marginBottom:8}}>{kname(k,lang)} <span className="muted small">{k.rule==="rate"?`(${t.regRate}: ${k.threshold*100}% ${t.noCap.toLowerCase()} — override optional)`:""}</span></h2>
      <table><thead><tr><th>{tab==="branch"?t.branch:t.pharmacist}</th>{mlabels.map(m=><th key={m} className="num">{m}</th>)}<th className="num">{t.qTotal}</th><th></th></tr></thead><tbody>
        {subjects.map(s=>{ const r=row(k.code,tab==="branch"?s.id:null,tab==="branch"?null:s.id); const tot=["m1","m2","m3"].reduce((a,m)=>a+(Number(r[m])||0),0);
          return <tr key={s.id}><td>{s.full_name||s.name}{tab==="ph"&&<div className="muted small">{bname(D.branches,s.branch_id)}</div>}</td>
            {["m1","m2","m3"].map(m=><td key={m}><input type="number" step="any" className="num" value={r[m]} onChange={e=>setCell(k.code,s.id,m,e.target.value)} placeholder={k.rule==="rate"?String(k.threshold):"0"}/></td>)}
            <td className="num">{fmt(tot)}</td><td><button className="btn sec" style={{padding:"4px 8px"}} onClick={()=>split(k.code,s.id)}>{t.split}</button></td></tr>; })}
      </tbody></table></div>)}
    <div><button className="btn" onClick={save} disabled={!Object.keys(edits).length}>{t.save}</button></div>
  </div>;
}

async function exportPdf(node,filename){
  const canvas=await html2canvas(node,{scale:2,useCORS:true,backgroundColor:"#ffffff"});
  const pdf=new jspdf.jsPDF({unit:"mm",format:"a4",orientation:"portrait"}); const W=210,H=297,margin=8;
  const imgW=W-2*margin, pageH=H-2*margin; const ratio=imgW/canvas.width; const pagePx=Math.floor(pageH/ratio);
  for(let y=0,i=0; y<canvas.height; y+=pagePx,i++){ const c=document.createElement("canvas"); c.width=canvas.width; c.height=Math.min(pagePx,canvas.height-y);
    c.getContext("2d").drawImage(canvas,0,y,canvas.width,c.height,0,0,canvas.width,c.height); if(i>0) pdf.addPage();
    pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",margin,margin,imgW,c.height*ratio); }
  pdf.save(filename);
}

        <button className="btn sec" onClick={clearForm}>{v.newVisit}</button></div>
      {last && <div className="muted small">{v.savedHint}</div>}

    {exp && <div style={{position:"fixed",left:-10000,top:0}}><div id="visit-print"><VisitPrint visit={exp} D={D} lang={lang} me={me}/></div></div>}

}

/* ================= DATA (admin): snapshots ================= */
function Data({t,me,D,E,reload,toast,lang}){
  const [mk,setMk]=useState(thisMonth()); const [f,setF]=useState({kpi_code:"sales",subject:"",as_of:today(),value:"",numerator:"",denominator:""});
  const [csv,setCsv]=useState(""); const [hist,setHist]=useState(null);
  const k=D.kpis.find(x=>x.code===f.kpi_code); const subjects=k?.level==="branch"?D.branches:D.pharmacists.filter(scored);
  const subjRow=()=> k.level==="branch"? {branch_id:f.subject,pharmacist_id:null} : {branch_id:null,pharmacist_id:f.subject};
  const add=async()=>{ if(!f.subject) return; const r=await sb.from("snapshots").upsert({kpi_code:f.kpi_code,month:mk,as_of:f.as_of,...subjRow(),value:Number(f.value)||0,numerator:f.numerator===""?null:Number(f.numerator),denominator:f.denominator===""?null:Number(f.denominator),source:"manual",created_by:me.id},{onConflict:"kpi_code,month,as_of,branch_id,pharmacist_id"}); toast(r.error?r.error.message:t.saved); if(!r.error) reload(); };
  const resolve=(kk,name,mk)=>{ const n=(name||"").trim().toLowerCase(); if(kk.level==="branch"){ const b=D.branches.find(b=>b.name.toLowerCase()===n); if(b) return b; const ph=D.pharmacists.find(p=>p.full_name.toLowerCase()===n); if(!ph) return null;
      const sh=mk? E.shares(ph.id,mk) : []; const bid= sh.length? sh.sort((a,b)=>b.share-a.share)[0].branch_id : ph.branch_id; return bid? D.branches.find(b=>b.id===bid) : null; } return D.pharmacists.find(p=>p.full_name.toLowerCase()===n); };
  const [tcsv,setTcsv]=useState("");
  const runTargets=async()=>{ const lines=tcsv.trim().split(/\r?\n/).filter(Boolean); const head=lines[0].split(",").map(x=>x.trim()); const rows=[]; const bad=[];
    lines.slice(1).forEach((l,i)=>{ const c=l.split(",").map(x=>x.trim()); const o=Object.fromEntries(head.map((h,j)=>[h,c[j]])); const kk=D.kpis.find(x=>x.code===o.kpi_code); const sub=kk&&resolve(kk,o.subject,`${o.year}-${String((Number(o.quarter)-1)*3+1).padStart(2,"0")}-01`); if(!kk||!sub||!o.year||!o.quarter) return bad.push(i+2);
      rows.push({kpi_code:o.kpi_code,year:Number(o.year),quarter:Number(o.quarter),branch_id:kk.level==="branch"?sub.id:null,pharmacist_id:kk.level==="branch"?null:sub.id,m1:Number(o.m1)||0,m2:Number(o.m2)||0,m3:Number(o.m3)||0}); });
    if(!rows.length) return toast("0 rows"); const r=await sb.from("targets").upsert(rows,{onConflict:"kpi_code,year,quarter,branch_id,pharmacist_id"}); toast(r.error?r.error.message:`${t.saved}: ${rows.length}${bad.length?` · skipped lines ${bad.join(",")}`:""}`); if(!r.error){ setTcsv(""); reload(); } };
  const runImport=async()=>{ const lines=csv.trim().split(/\r?\n/).filter(Boolean); const head=lines[0].split(",").map(s=>s.trim()); const rows=[]; const bad=[];
    lines.slice(1).forEach((l,i)=>{ const c=l.split(",").map(s=>s.trim()); const o=Object.fromEntries(head.map((h,j)=>[h,c[j]])); const kk=D.kpis.find(x=>x.code===o.kpi_code); if(!kk) return bad.push(i+2);
      const s=resolve(kk,o.subject,o.month?o.month.slice(0,7)+"-01":null); if(!s||!o.month) return bad.push(i+2);
      rows.push({kpi_code:o.kpi_code,month:o.month.slice(0,7)+"-01",as_of:o.as_of||(o.month.slice(0,7)+"-28"),branch_id:kk.level==="branch"?s.id:null,pharmacist_id:kk.level==="branch"?null:s.id,value:Number(o.value)||0,numerator:o.numerator?Number(o.numerator):null,denominator:o.denominator?Number(o.denominator):null,source:"import",created_by:me.id}); });
    if(!rows.length) return toast("0 rows"); const r=await sb.from("snapshots").upsert(rows,{onConflict:"kpi_code,month,as_of,branch_id,pharmacist_id"}); toast(r.error?r.error.message:`${t.saved}: ${rows.length}${bad.length?` · skipped lines ${bad.join(",")}`:""}`); if(!r.error){ setCsv(""); reload(); } };
  const del=async(id)=>{ const r=await sb.from("snapshots").delete().eq("id",id); toast(r.error?r.error.message:t.saved); reload(); if(hist) showHist(hist.key); };
  const latest=D.snaps.filter(s=>s.month===mk).sort((a,b)=>a.kpi_code.localeCompare(b.kpi_code));
  const showHist=async(s)=>{ const q=sb.from("snapshots").select("*").eq("kpi_code",s.kpi_code).eq("month",s.month).order("as_of",{ascending:false}); const r= s.branch_id? await q.eq("branch_id",s.branch_id) : await q.eq("pharmacist_id",s.pharmacist_id); setHist({key:s,rows:r.data||[]}); };
  const subjName=s=>s.branch_id?bname(D.branches,s.branch_id):D.pharmacists.find(p=>p.id===s.pharmacist_id)?.full_name;
  return <div className="grid">
    <div className="row" style={{justifyContent:"space-between"}}><h1>{t.data}</h1><MonthPicker mk={mk} set={setMk} lang={lang}/></div>
    <div className="card grid"><h2>{t.addSnapshot}</h2><div className="row">
      <label className="f">{t.kpi}<select value={f.kpi_code} onChange={e=>setF({...f,kpi_code:e.target.value,subject:""})}>{D.kpis.filter(x=>x.rule!=="visit").map(x=><option key={x.code} value={x.code}>{kname(x,lang)}</option>)}</select></label>
      <label className="f">{k?.level==="branch"?t.branch:t.pharmacist}<select value={f.subject} onChange={e=>setF({...f,subject:e.target.value})}><option value="">—</option>{subjects.map(s=><option key={s.id} value={s.id}>{s.name||s.full_name}</option>)}</select></label>
      <label className="f">{t.asOf}<input type="date" value={f.as_of} onChange={e=>setF({...f,as_of:e.target.value})}/></label>
      {k?.rule!=="rate" && <label className="f">{f.kpi_code==="expire"?t.expired:t.value}<input type="number" step="any" value={f.value} onChange={e=>setF({...f,value:e.target.value})}/></label>}
      {k?.rule==="rate" && <><label className="f">{t.numerator}<input type="number" value={f.numerator} onChange={e=>setF({...f,numerator:e.target.value})}/></label><label className="f">{t.denominator}<input type="number" value={f.denominator} onChange={e=>setF({...f,denominator:e.target.value})}/></label></>}
      <button className="btn" onClick={add} disabled={!f.subject}>{t.add}</button></div></div>
    <div className="card grid"><h2>{t.importCsv}</h2><div className="muted small">{t.csvHint}</div>
      <pre className="csv">kpi_code,subject,month,as_of,value,numerator,denominator{"\n"}sales,Sawarmah,2025-09,2025-09-30,412000,,{"\n"}registration,Ahmed Ali,2025-09,2025-09-30,,640,800</pre>
      <textarea rows="5" value={csv} onChange={e=>setCsv(e.target.value)} dir="ltr" style={{fontFamily:"monospace",fontSize:12}}/>
      <div><button className="btn sec" onClick={runImport} disabled={!csv.trim()}>{t.importRun}</button></div>
      <h3 style={{marginTop:8}}>{t.targets} CSV</h3><pre className="csv">kpi_code,subject,year,quarter,m1,m2,m3{"\n"}sales,Sawarmah,2026,1,50000,50000,50000{"\n"}lab,Ahmed Ali,2026,1,500,500,500</pre>
      <textarea rows="4" value={tcsv} onChange={e=>setTcsv(e.target.value)} dir="ltr" style={{fontFamily:"monospace",fontSize:12}}/>
      <div><button className="btn sec" onClick={runTargets} disabled={!tcsv.trim()}>{t.importRun}</button></div></div>
    <div className="card"><h2 style={{marginBottom:8}}>{t.latest} · {monthLabel(mk,lang)}</h2>
      {latest.length===0? <div className="empty">{t.noData}</div> :
      <table><thead><tr><th>{t.kpi}</th><th>{t.branch}/{t.pharmacist}</th><th className="num">{t.value}</th><th>{t.asOf}</th><th>{t.source}</th><th></th></tr></thead><tbody>
        {latest.map(s=><tr key={s.id}><td>{kname(D.kpis.find(x=>x.code===s.kpi_code)||{name_en:s.kpi_code},lang)}</td><td>{subjName(s)}</td><td className="num">{s.kpi_code==="registration"?`${fmt(s.numerator)} / ${fmt(s.denominator)}`:fmt(s.value)}</td><td>{s.as_of}</td><td className="small muted">{s.source}</td>
          <td className="row" style={{gap:6}}><button className="btn sec" style={{padding:"4px 8px"}} onClick={()=>showHist(s)}>{t.history}</button><button className="btn warn" style={{padding:"4px 8px"}} onClick={()=>del(s.id)}>×</button></td></tr>)}
      </tbody></table>}</div>
    {hist && <div className="card"><div className="row" style={{justifyContent:"space-between"}}><h3>{t.history} · {subjName(hist.key)} · {kname(D.kpis.find(x=>x.code===hist.key.kpi_code),lang)}</h3><button className="btn sec" style={{padding:"4px 8px"}} onClick={()=>setHist(null)}>×</button></div>
      <table><tbody>{hist.rows.map(s=><tr key={s.id}><td>{s.as_of}</td><td className="num">{s.kpi_code==="registration"?`${fmt(s.numerator)} / ${fmt(s.denominator)}`:fmt(s.value)}</td><td className="small muted">{s.source}</td><td><button className="btn warn" style={{padding:"3px 8px"}} onClick={()=>del(s.id)}>×</button></td></tr>)}</tbody></table></div>}
  </div>;
}

/* ================= TEAM (admin) ================= */
function Team({t,D,reload,toast}){
  const {branches,pharmacists}=D; const [nb,setNb]=useState(""); const [np,setNp]=useState({}); const [sel,setSel]=useState("all"); const [mv,setMv]=useState({});
  const run=async(q)=>{ const r=await q; toast(r.error?r.error.message:t.saved); reload(); return r; };
  const addBranch=()=>{ if(!nb.trim()) return; run(sb.from("branches").insert({name:nb.trim()})); setNb(""); };
  const removeBranch=b=>{ if(pharmacists.some(p=>p.branch_id===b.id)) return toast(t.deleteBranchBlocked); if(confirm(t.remove+" "+b.name+"?")) run(sb.from("branches").delete().eq("id",b.id)); };
  const addPh=async bid=>{ const f=np[bid]||{}; if(!f.name?.trim()) return; const r=await sb.from("pharmacists").insert({full_name:f.name.trim(),emp_code:f.code||null,title:f.title||"community pharmacist",branch_id:bid==="none"?null:bid}).select().single(); if(r.error) return toast(r.error.message);
    if(bid!=="none") await sb.from("pharmacist_assignments").insert({pharmacist_id:r.data.id,branch_id:bid,from_date:f.from||thisMonth()}); toast(t.saved); setNp({...np,[bid]:{}}); reload(); };
  const removePh=p=>{ if(confirm(t.confirmRemove)) run(sb.from("pharmacists").delete().eq("id",p.id)); };
  const move=async p=>{ const m=mv[p.id]||{}; const to=m.branch; const from=m.from||today(); if(!to||to===p.branch_id) return;
    const prev=new Date(from+"T00:00:00Z"); prev.setUTCDate(prev.getUTCDate()-1);
    await sb.from("pharmacist_assignments").update({to_date:prev.toISOString().slice(0,10)}).eq("pharmacist_id",p.id).is("to_date",null);
    await run(sb.from("pharmacist_assignments").insert({pharmacist_id:p.id,branch_id:to,from_date:from})); setMv({...mv,[p.id]:{}}); };
  const updPh=(id,patch)=>run(sb.from("pharmacists").update(patch).eq("id",id));
  const shown = sel==="all"? branches : branches.filter(b=>b.id===sel);
  const groups=[...shown.map(b=>({id:b.id,name:b.name,list:pharmacists.filter(p=>p.branch_id===b.id)})), ...(sel==="all"?[{id:"none",name:t.noBranch,list:pharmacists.filter(p=>!p.branch_id)}]:[])];
  return <div className="grid">
    <div className="row" style={{justifyContent:"space-between"}}><h1>{t.team}</h1><span className="muted small">{pharmacists.length} {t.pharmacists} · {branches.length} {t.branches}</span></div>
    <div className="card grid"><h2>{t.branches}</h2>
      <div className="row">{branches.map(b=><span key={b.id} className="chip" style={{padding:"6px 10px",fontSize:13,cursor:"pointer",background:sel===b.id?"var(--teal)":"",color:sel===b.id?"#fff":""}} onClick={()=>setSel(sel===b.id?"all":b.id)}>{b.name} <span style={{opacity:.7}}>({pharmacists.filter(p=>p.branch_id===b.id).length})</span><button title={t.remove} onClick={e=>{e.stopPropagation();removeBranch(b)}} style={{background:"transparent",border:0,cursor:"pointer",color:"inherit",marginInlineStart:6}}>×</button></span>)}
        <span className="chip" style={{padding:"6px 10px",fontSize:13,cursor:"pointer",background:sel==="all"?"var(--teal)":"#EDF1EF",color:sel==="all"?"#fff":"var(--ink-2)"}} onClick={()=>setSel("all")}>{t.allBranches}</span></div>
      <div className="row"><input placeholder={t.newBranch} value={nb} onChange={e=>setNb(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addBranch()} style={{maxWidth:280}}/><button className="btn sec" onClick={addBranch}>{t.add}</button></div></div>
    {groups.map(g=><div key={g.id} className="card">
      <div className="row" style={{justifyContent:"space-between",marginBottom:8}}><h2>{g.name}</h2><span className="muted small">{g.list.length} {t.pharmacists}</span></div>
      {g.list.length>0 && <table><thead><tr><th>{t.name}</th><th>{t.empCode}</th><th>{t.title}</th><th>{t.moveTo}</th><th>{t.effective}</th><th>{t.status}</th><th></th></tr></thead><tbody>
        {g.list.map(p=><tr key={p.id} style={{opacity:p.active?1:.55}}>
          <td>{p.full_name}</td><td className="muted">{p.emp_code||"—"}</td>
          <td><select value={p.title||"community pharmacist"} onChange={e=>updPh(p.id,{title:e.target.value})}><option value="community pharmacist">{t.tPh}</option><option value="pharmacy manager">{t.tPm}</option><option value="supervisor">{t.tSup}</option><option value="management">{t.tMgmt}</option></select></td>
          <td><select value={mv[p.id]?.branch||""} onChange={e=>setMv({...mv,[p.id]:{...(mv[p.id]||{}),branch:e.target.value}})}><option value="">—</option>{branches.filter(b=>b.id!==p.branch_id).map(b=><option key={b.id} value={b.id}>{b.name}</option>)}</select></td>
          <td className="row" style={{gap:6,flexWrap:"nowrap"}}><input type="date" value={mv[p.id]?.from||today()} onChange={e=>setMv({...mv,[p.id]:{...(mv[p.id]||{}),from:e.target.value}})} style={{width:150}}/><button className="btn sec" style={{padding:"5px 10px"}} disabled={!mv[p.id]?.branch} onClick={()=>move(p)}>{t.move}</button></td>
          <td><label className="check"><input type="checkbox" checked={p.active} onChange={e=>updPh(p.id,{active:e.target.checked})}/>{t.active}</label></td>
          <td><button className="btn warn" style={{padding:"5px 10px"}} onClick={()=>removePh(p)}>{t.remove}</button></td></tr>)}
      </tbody></table>}
      <div className="row" style={{marginTop:10}}>
        <input placeholder={t.pharmacistName} value={np[g.id]?.name||""} onChange={e=>setNp({...np,[g.id]:{...(np[g.id]||{}),name:e.target.value}})} onKeyDown={e=>e.key==="Enter"&&addPh(g.id)} style={{maxWidth:240}}/>
        <input placeholder={t.empCode} value={np[g.id]?.code||""} onChange={e=>setNp({...np,[g.id]:{...(np[g.id]||{}),code:e.target.value}})} style={{maxWidth:130}}/>
        <select value={np[g.id]?.title||"community pharmacist"} onChange={e=>setNp({...np,[g.id]:{...(np[g.id]||{}),title:e.target.value}})} style={{maxWidth:180}}><option value="community pharmacist">{t.tPh}</option><option value="pharmacy manager">{t.tPm}</option><option value="supervisor">{t.tSup}</option><option value="management">{t.tMgmt}</option></select>
        {g.id!=="none" && <input type="date" title={t.effective} value={np[g.id]?.from||thisMonth()} onChange={e=>setNp({...np,[g.id]:{...(np[g.id]||{}),from:e.target.value}})} style={{maxWidth:160}}/>}
        <button className="btn sec" onClick={()=>addPh(g.id)}>{t.addPharmacist}</button></div>
    </div>)}
  </div>;
}

/* ================= ACCOUNTS (admin) ================= */
function Accounts({t,me,D,toast}){
  const {branches,pharmacists}=D; const [profiles,setProfiles]=useState([]);
  const load=useCallback(async()=>{ const r=await sb.from("profiles").select("*").order("created_at",{ascending:false}); setProfiles(r.data||[]); },[]);
  useEffect(()=>{load()},[load]);
  const upd=async(id,patch)=>{ const r=await sb.from("profiles").update(patch).eq("id",id); toast(r.error?r.error.message:t.saved); load(); };
  const takenBy=pid=>profiles.find(p=>p.pharmacist_id===pid);
  return <div className="grid"><h1>{t.accounts}</h1><div className="muted small">{t.linkHint}</div><div className="card">
    <table><thead><tr><th>{t.name}</th><th>{t.email}</th><th>{t.role}</th><th>{t.linkedTo}</th><th>{t.tabs}</th><th>{t.scope}</th><th>{t.superAdmin}</th><th>{t.status}</th></tr></thead><tbody>
      {profiles.map(p=>{ const linked=pharmacists.find(x=>x.id===p.pharmacist_id); return <tr key={p.id}>
        <td>{p.full_name}{!p.pharmacist_id&&p.role==="pharmacist"&&<div><span className="chip bad">{t.unlinked}</span></div>}</td>
        <td className="small" dir="ltr">{p.email||"—"}</td>
        <td><select value={p.role} disabled={p.id===me.id} onChange={e=>upd(p.id,{role:e.target.value})}><option value="pharmacist">{t.pharmacist}</option><option value="supervisor">{t.supervisor}</option><option value="admin">{t.admin}</option></select></td>
        <td><select value={p.pharmacist_id||""} onChange={e=>upd(p.id,{pharmacist_id:e.target.value||null})}><option value="">{t.notLinked}</option>{pharmacists.map(x=>{ const tb=takenBy(x.id); return <option key={x.id} value={x.id} disabled={tb&&tb.id!==p.id}>{x.full_name} — {bname(branches,x.branch_id)}{tb&&tb.id!==p.id?" ✓":""}</option>; })}</select>{linked&&<div className="muted small">{bname(branches,linked.branch_id)}</div>}</td>
        <td><div className="row" style={{gap:8}}>{["dash","visits","data","targets","team"].map(k=><label key={k} className="check small"><input type="checkbox" checked={(p.pages||[]).includes(k)} disabled={p.is_super&&p.role==="admin"} onChange={e=>{ const cur=(p.pages||[]).filter(x=>x!==k); upd(p.id,{pages:e.target.checked?[...cur,k]:cur}); }}/>{t[k]}</label>)}</div></td>
        <td>{p.role==="supervisor"? <select value={p.branch_id||""} onChange={e=>upd(p.id,{branch_id:e.target.value||null})}><option value="">{t.allBranches}</option>{branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}</select> : <span className="muted">—</span>}</td>
        <td>{p.role==="admin"? <input type="checkbox" checked={!!p.is_super} disabled={p.id===me.id} onChange={e=>upd(p.id,{is_super:e.target.checked})}/> : <span className="muted">—</span>}</td>
        <td><label className="check"><input type="checkbox" checked={p.active} disabled={p.id===me.id} onChange={e=>upd(p.id,{active:e.target.checked})}/>{t.active}</label></td></tr>; })}
    </tbody></table></div></div>;
}

/* ================= SETTINGS (admin): weights/caps + checklist ================= */
function Settings({t,D,E,reload,toast,lang}){
  const q0=qOf(thisMonth()); const [year,setYear]=useState(q0.year); const [quarter,setQuarter]=useState(q0.quarter);
  const [ed,setEd]=useState({}); const [ni,setNi]=useState({en:"",ar:""}); useEffect(()=>setEd({}),[year,quarter]);
  const mk=`${year}-${String((quarter-1)*3+1).padStart(2,"0")}-01`; const kpis=E.kpisFor(mk);
  const val=(k,f)=> ed[k.code]?.[f] ?? (k[f]??"");
  const saveK=async()=>{ const rows=kpis.map(k=>({kpi_code:k.code,year,quarter,weight:Number(val(k,"weight"))||0,cap:val(k,"cap")===""?null:Number(val(k,"cap")),threshold:k.threshold==null?null:Number(val(k,"threshold")),active:ed[k.code]?.active??k.active}));
    const r=await sb.from("kpi_periods").upsert(rows,{onConflict:"kpi_code,year,quarter"}); toast(r.error?r.error.message:t.saved); if(!r.error){ setEd({}); reload(); } };
  const addItem=async()=>{ if(!ni.en.trim()) return; const r=await sb.from("visit_items").insert({text_en:ni.en.trim(),text_ar:(ni.ar||"").trim(),section_en:(ni.sen||"").trim()||null,section_ar:(ni.sar||"").trim()||null,points:Number(ni.pts)||1,sort:(Math.max(0,...D.visit_items.map(x=>x.sort))||0)+1}); toast(r.error?r.error.message:t.saved); setNi({en:"",ar:""}); reload(); };
  const updItem=async(id,patch)=>{ const r=await sb.from("visit_items").update(patch).eq("id",id); toast(r.error?r.error.message:t.saved); reload(); };
  const total=kpis.filter(k=>(ed[k.code]?.active??k.active)).reduce((a,k)=>a+Number(val(k,"weight")||0),0);
  return <div className="grid"><h1>{t.settings}</h1>
    <div className="card"><div className="row" style={{justifyContent:"space-between"}}><div className="row"><h2>{t.kpi}</h2><select value={year} onChange={e=>setYear(Number(e.target.value))} style={{width:"auto"}}>{[q0.year-1,q0.year,q0.year+1].map(y=><option key={y}>{y}</option>)}</select><select value={quarter} onChange={e=>setQuarter(Number(e.target.value))} style={{width:"auto"}}>{[1,2,3,4].map(q=><option key={q} value={q}>Q{q}</option>)}</select></div><span className={"chip "+(total===100?"":"bad")}>Σ {t.weight} = {total}</span></div>
      <table><thead><tr><th>{t.kpi}</th><th>{t.level}</th><th className="num">{t.weight}</th><th className="num">{t.cap}</th><th className="num">%</th><th>{t.active}</th></tr></thead><tbody>
        {kpis.map(k=><tr key={k.code}><td><strong>{kname(k,lang)}</strong><div className="muted small">{k.code} · {k.rule}</div></td><td>{k.level==="branch"?t.branch:t.pharmacist}</td>
          <td><input type="number" className="num" value={val(k,"weight")} onChange={e=>setEd({...ed,[k.code]:{...ed[k.code],weight:e.target.value}})}/></td>
          <td>{k.rule==="all_or_none"?<span className="muted">—</span>:<input type="number" step="0.1" className="num" placeholder={t.noCap} value={val(k,"cap")} onChange={e=>setEd({...ed,[k.code]:{...ed[k.code],cap:e.target.value}})}/>}</td>
          <td>{k.threshold!=null?<input type="number" step="0.001" className="num" value={val(k,"threshold")} onChange={e=>setEd({...ed,[k.code]:{...ed[k.code],threshold:e.target.value}})}/>:<span className="muted">—</span>}</td>
          <td><input type="checkbox" checked={ed[k.code]?.active??k.active} onChange={e=>setEd({...ed,[k.code]:{...ed[k.code],active:e.target.checked}})}/></td></tr>)}
      </tbody></table><div style={{marginTop:12}}><button className="btn" onClick={saveK}>{t.save} Q{quarter} {year}</button></div></div>
    <div className="card grid"><h2>{t.checklist} <span className="muted small">Σ {D.visit_items.filter(i=>i.active).reduce((a,i)=>a+Number(i.points),0)}</span></h2>
      <table><thead><tr><th>{t.sectionEn}</th><th>{t.itemEn}</th><th className="num">{t.points}</th><th>{t.active}</th></tr></thead><tbody>
      {D.visit_items.map(i=><tr key={i.id} style={{opacity:i.active?1:.5}}><td className="small">{lang==="ar"&&i.section_ar?i.section_ar:i.section_en}</td><td>{lang==="ar"&&i.text_ar?i.text_ar:i.text_en}</td><td className="num">{i.points}</td><td><input type="checkbox" checked={i.active} onChange={e=>updItem(i.id,{active:e.target.checked})}/></td></tr>)}
      </tbody></table>
      <div className="row"><input placeholder={t.sectionEn} value={ni.sen||""} onChange={e=>setNi({...ni,sen:e.target.value})}/><input placeholder={t.sectionAr} dir="rtl" value={ni.sar||""} onChange={e=>setNi({...ni,sar:e.target.value})}/></div>
      <div className="row"><input placeholder={t.itemEn} value={ni.en} onChange={e=>setNi({...ni,en:e.target.value})}/><input placeholder={t.itemAr} dir="rtl" value={ni.ar} onChange={e=>setNi({...ni,ar:e.target.value})}/><input type="number" placeholder={t.points} value={ni.pts||""} onChange={e=>setNi({...ni,pts:e.target.value})} style={{maxWidth:100}}/><button className="btn sec" onClick={addItem}>{t.add}</button></div></div>
  </div>;
}

/* ================= APP ================= */
function App(){
  const [lang,setLang]=useState(localStorage.getItem("lang")||"en"); const t=T[lang];
  useEffect(()=>{ document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr"; localStorage.setItem("lang",lang); },[lang]);
  const [session,setSession]=useState(undefined); const [me,setMe]=useState(null); const [D,setD]=useState(null);
  const [page,setPage]=useState("dash"); const [msg,setMsg]=useState("");
  const toast=m=>{ setMsg(m); if(m!==t.saved) console.error(m); setTimeout(()=>setMsg(""), m===t.saved?2200:7000); };
  useEffect(()=>{ sb.auth.getSession().then(({data})=>setSession(data.session)); const {data:sub}=sb.auth.onAuthStateChange((_,s)=>setSession(s)); return ()=>sub.subscription.unsubscribe(); },[]);
  const reload=useCallback(async()=>{
    const [b,p,a,k,tg,sn,vi,vs,sc]=await Promise.all([
      sb.from("branches").select("*").eq("active",true).order("name"), sb.from("pharmacists").select("*").order("full_name"),
      sb.from("pharmacist_assignments").select("*"), sb.from("kpis").select("*").order("sort"), sb.from("targets").select("*"),
      sb.from("v_latest_snapshots").select("*"), sb.from("visit_items").select("*").order("sort"), sb.from("visits").select("*").order("visit_date",{ascending:false}).limit(2000), sb.from("kpi_periods").select("*")]);
    const err=[b,p,a,k,tg,sn,vi,vs,sc].find(r=>r.error); if(err) toast(err.error.message);
    setD({branches:b.data||[],pharmacists:p.data||[],assignments:a.data||[],kpis:k.data||[],targets:tg.data||[],snaps:sn.data||[],visit_items:vi.data||[],visits:vs.data||[],schemes:sc.data||[]});
  },[]);
  useEffect(()=>{ if(!session){setMe(null);setD(null);return;} (async()=>{ const r=await sb.from("profiles").select("*").eq("id",session.user.id).single(); setMe(r.data||null); await reload(); })(); },[session]);
  const E=useMemo(()=>D?makeEngine(D):null,[D]);

  if(session===undefined) return null;
  if(!session) return <Login t={t} lang={lang} setLang={setLang}/>;
  if(!me||!D) return <div className="empty">…</div>;
  const linked = me.role!=="pharmacist" || !!me.pharmacist_id;
  // tab visibility: super admin sees everything; others follow the page_access matrix (Admin → Settings)
  const can=k=> me.is_super&&me.role==="admin"? true : (k==="accounts"||k==="settings")? false : (me.pages||[]).includes(k);
  const GROUPS=[["dash",t.dash,["dash"]],["visits",t.visits,["visits"]],["data",t.data,["data","targets"]],["admin",t.admin2,["team","accounts","settings"]]];
  const tabs=GROUPS.filter(g=>g[2].some(can)).map(g=>[g[0],g[1]]);
  const firstAllowed=GROUPS.flatMap(g=>g[2]).find(can);
  const group=GROUPS.find(g=>g[2].includes(page))?.[0]||"dash"; const subs=(GROUPS.find(g=>g[0]===group)?.[2]||[]).filter(can);
  const props={t,me,D,E,toast,lang,reload};
  return <>
    <div className="bar"><div className="brand">{t.app} <span>{t.kpi}</span></div>
      <div className="tabs">{linked && tabs.map(([k,l])=><button key={k} className={"tab"+(group===k?" on":"")} onClick={()=>setPage(GROUPS.find(g=>g[0]===k)[2].filter(can)[0])}>{l}</button>)}</div>
      <div className="who">{me.full_name} · {me.is_super?t.superAdmin:(t[me.role]||me.role)}</div>
      <button className="ghost" onClick={()=>setLang(lang==="en"?"ar":"en")}>{t.lang}</button><button className="ghost" onClick={()=>sb.auth.signOut()}>{t.out}</button></div>
    <div className="wrap">{!linked ? <div className="card empty">{t.notLinkedMsg}</div> : !firstAllowed ? <div className="card empty">{t.noAccess}</div> : !can(page) ? (setPage(firstAllowed),null) : <>
      {subs.length>1 && <div className="subtabs" style={{marginBottom:14}}>{subs.map(k=><button key={k} className={page===k?"on":""} onClick={()=>setPage(k)}>{t[k]}</button>)}</div>}
      {page==="dash"     && <Dashboard key={me.id} {...props}/>}
      {page==="visits"   && can("visits")   && <Visits {...props}/>}
      {page==="targets"  && can("targets")  && <Targets {...props}/>}
      {page==="data"     && can("data")     && <Data {...props}/>}
      {page==="team"     && can("team")     && <Team {...props}/>}
      {page==="accounts" && can("accounts") && <Accounts {...props}/>}
      {page==="settings" && can("settings") && <Settings {...props}/>}</>}</div>
    <Toast msg={msg}/>
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
