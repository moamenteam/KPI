<!doctype html>
<html lang="en" data-ui="glass3d">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>First Brand KPI</title>
<link rel="stylesheet" href="./theme.css?v=fb1">
<script src="./theme.js?v=fb1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@300;400;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F4F7F5; --card:#FFFFFF; --ink:#14383A; --ink-2:#4A6466; --line:#D7E2DE;
    --teal:#1F6F6B; --teal-soft:#E3F1EE; --amber:#E39B2F; --amber-soft:#FBEFD9;
    --good:#2E8B6A; --bad:#C4472B; --bad-soft:#FBE6E0;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.45}
  [dir=rtl] body, body[dir=rtl]{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
  h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--teal)}
  .muted{color:var(--ink-2)}
  .small{font-size:13px}

  /* top bar */
  .bar{background:var(--ink);color:#fff;padding:0 18px;display:flex;align-items:center;gap:18px;height:56px;position:sticky;top:0;z-index:5}
  .brand{font-weight:700;letter-spacing:.02em;white-space:nowrap}
  .brand span{color:var(--amber)}
  .home{color:#fff;text-decoration:none;display:flex;align-items:center;gap:6px}
  .home:hover{opacity:.85}
  .tabs{display:flex;gap:4px;flex:1;overflow:auto}
  .tab{background:transparent;border:0;color:#CFE0DC;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .tab.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
  .bar .who{font-size:13px;color:#CFE0DC;white-space:nowrap}
  .ghost{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}

  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 80px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .g3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}

  /* forms */
  label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);flex:1;min-width:140px}
  input,select,textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;width:100%}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
  input[type=number]{font-variant-numeric:tabular-nums}
  .check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);flex:0}
  .check input{width:auto}
  .btn{background:var(--teal);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer}
  .btn.sec{background:var(--teal-soft);color:var(--teal)}
  .btn.warn{background:var(--bad-soft);color:var(--bad)}
  .btn:disabled{opacity:.5;cursor:default}
  .toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9}
  [dir=rtl] .toast{transform:translateX(50%)}
  .err{background:var(--bad-soft);color:var(--bad);border-radius:9px;padding:9px 12px;font-size:14px}

  /* login */
  .login{min-height:100vh;display:grid;place-items:center;padding:20px}
  .login .card{width:100%;max-width:400px;padding:28px}
  .login h1{font-size:22px;margin-bottom:4px}

  /* chips / table */
  .chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--teal-soft);color:var(--teal)}
  .chip.amber{background:var(--amber-soft);color:#8A5A0E}
  .chip.bad{background:var(--bad-soft);color:var(--bad)}
  .chip.grey{background:#EDF1EF;color:var(--ink-2)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:start;font-weight:500;color:var(--ink-2);font-size:13px;padding:8px 6px;border-bottom:1px solid var(--line)}
  td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  td input,td select{padding:6px 8px}

  /* dashboard hero: momentum */
  .hero{display:grid;grid-template-columns:1fr 2fr;gap:14px}
  @media(max-width:720px){.hero{grid-template-columns:1fr}}
  .mo{background:var(--ink);color:#fff;border-radius:var(--r);padding:20px;display:flex;flex-direction:column;justify-content:space-between;min-height:170px}
  .mo .big{font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .mo .big small{font-size:22px;font-weight:500;color:#CFE0DC}
  .delta{font-size:14px;font-weight:600}
  .delta.up{color:#7FD9B5}.delta.down{color:#F59A82}.delta.flat{color:#CFE0DC}
  .strip{display:grid;grid-template-columns:repeat(28,1fr);gap:4px;margin-top:10px}
  .strip i{display:block;height:14px;border-radius:3px;background:#EDF1EF}
  .strip i.on{background:var(--teal)}
  .strip i.today{outline:2px solid var(--amber);outline-offset:-2px}
  .kpi-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .pct{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .pct.good{color:var(--good)}.pct.mid{color:var(--amber)}.pct.bad{color:var(--bad)}
  .bar-track{height:8px;background:#EDF1EF;border-radius:99px;overflow:hidden;margin:10px 0 6px}
  .bar-fill{height:100%;border-radius:99px;background:var(--teal)}
  .bar-fill.good{background:var(--good)}.bar-fill.mid{background:var(--amber)}.bar-fill.bad{background:var(--bad)}
  .spark{width:100%;height:44px;display:block;margin-top:8px}
  .empty{padding:36px;text-align:center;color:var(--ink-2)}
  @media(prefers-reduced-motion:no-preference){.bar-fill{transition:width .5s ease}}
</style>
</head>
<body>
<div id="root" style="padding:40px;color:#4A6466">Loading…</div>
<script>
window.addEventListener("error",e=>{document.getElementById("root").innerHTML='<pre style="padding:20px;color:#C4472B;white-space:pre-wrap">'+(e.message||e.error)+'\n'+(e.filename||'')+':'+(e.lineno||'')+'</pre>'});
window.addEventListener("unhandledrejection",e=>{document.getElementById("root").innerHTML='<pre style="padding:20px;color:#C4472B;white-space:pre-wrap">'+(e.reason&&e.reason.message||e.reason)+'</pre>'});
</script>
<style>
  .score-row{display:grid;grid-template-columns:1.4fr 1fr 70px 90px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .score-row:last-child{border-bottom:0}
  @media(max-width:560px){.score-row{grid-template-columns:1fr 70px 90px}.score-row .sub{display:none}}
  .pts{font-weight:700;font-variant-numeric:tabular-nums;text-align:end}
  .pts small{font-weight:400;color:var(--ink-2)}
  .rank td:first-child{width:36px;color:var(--ink-2)}
  .subtabs{display:flex;gap:6px;flex-wrap:wrap}
  .subtabs button{background:#EDF1EF;border:0;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--ink-2)}
  .subtabs button.on{background:var(--teal);color:#fff}
  .num{font-variant-numeric:tabular-nums;text-align:end}
  .checkrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .checkrow input{width:20px;height:20px;margin-top:2px}
  .na{color:var(--ink-2);font-size:12px}
  pre.csv{white-space:pre-wrap;font-size:12px;background:#EDF1EF;padding:10px;border-radius:9px}
  .vform td input,.vform td select{padding:5px 7px}
  .vform input[readonly]{background:#F4F7F5}
  .stars{color:var(--amber);letter-spacing:1px;white-space:nowrap}
  .stars i{font-style:normal;color:#D7E2DE}
  .mo .stars i{color:rgba(255,255,255,.22)}
  .pace{display:grid;gap:3px;font-size:13px}
  .pace strong{color:var(--ink)}
  @media print{ .bar,.noprint,.btn{display:none!important} body{background:#fff} .wrap{max-width:none;padding:0} .card{break-inside:avoid;border-color:#999;margin-bottom:8px;padding:10px} input,select,textarea{border:0;border-bottom:1px solid #999;border-radius:0;padding:2px 4px} h1{font-size:18px} h2{font-size:14px} table{font-size:12px} }
  /* pharmacist period report */
  .rep-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;overflow:auto;padding:18px}
  .rep-bar{max-width:920px;margin:0 auto 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;background:#fff;border-radius:8px;padding:12px}
  .rep-bar label{display:grid;gap:3px;font-size:12px;color:#555}
  .rep-bar input{width:auto}
  html body .rep{background:#fff;color:#111;max-width:920px;margin:0 auto;border-radius:8px;padding:28px;font-size:13px;line-height:1.5}
  html body .rep h2{font-size:20px;margin:0;color:#111}
  html body .rep h3{font-size:14px;margin:18px 0 8px;color:#111}
  html body .rep .rhead{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #111;padding-bottom:12px;margin-bottom:14px;flex-wrap:wrap}
  html body .rep .rmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;margin-bottom:6px}
  html body .rep .rmeta div span{display:block;font-size:11px;color:#666}
  html body .rep .rsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0 4px}
  html body .rep .rsum div{border:1px solid #ddd;border-radius:6px;padding:10px}
  html body .rep .rsum b{display:block;font-size:22px}
  html body .rep .rsum span{font-size:11px;color:#666}
  html body .rep table{width:100%;border-collapse:collapse;font-size:12px}
  html body .rep th,html body .rep td{border:1px solid #d6d6d6;padding:6px 7px;text-align:center;white-space:nowrap;color:#111;background:#fff}
  html body .rep th{background:#F2F3F5;font-weight:600;color:#333}
  html body .rep td.l,html body .rep th.l{text-align:start;white-space:normal}
  html body .rep tr:hover td{background:#fff}
  html body .rep .tfoot td{font-weight:700;background:#F7F7F8}
  html body .rep .good{color:#1E7B34} html body .rep .mid{color:#A86B00} html body .rep .bad{color:#C62828}
  html body .rep .stars{color:#E5A100} html body .rep .stars i{color:#ccc}
  html body .rep .sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:34px}
  html body .rep .sign div{border-top:1px solid #111;padding-top:6px;font-size:12px;color:#444}
  html body .rep .foot{margin-top:18px;font-size:11px;color:#777}
  @media print{
    body.rep-open #root{display:none!important}
    body.rep-open .rep-ov{position:static;background:none;padding:0;overflow:visible}
    body.rep-open .rep-bar{display:none!important}
    body.rep-open .rep{max-width:none;border-radius:0;padding:0}
    body.rep-open .rep table,body.rep-open .rep .rsum{break-inside:avoid}
    @page{size:A4;margin:12mm}
  }
</style>
<style>
html[data-ui="soft"] .card{box-shadow:0 2px 10px rgba(20,40,38,.06);border-radius:16px}
html[data-ui="3d"] body{background:radial-gradient(1200px 600px at 50% -200px, color-mix(in srgb,var(--teal) 12%,#fff), var(--paper))}
html[data-ui="3d"] .bar{background:linear-gradient(135deg,var(--ink),color-mix(in srgb,var(--teal) 55%,#000));box-shadow:0 8px 22px -10px rgba(0,0,0,.45)}
html[data-ui="3d"] .card{border:0;border-radius:18px;background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--teal) 4%,#fff));
  box-shadow:0 14px 28px -18px rgba(20,40,38,.55),0 2px 6px rgba(20,40,38,.08)}
html[data-ui="3d"] .mo{box-shadow:0 18px 34px -20px rgba(0,0,0,.6);background:linear-gradient(135deg,var(--ink),color-mix(in srgb,var(--teal) 60%,#000))}
html[data-ui="3d"] .btn{box-shadow:0 4px 0 color-mix(in srgb,var(--teal) 62%,#000),0 8px 16px -8px rgba(0,0,0,.5)}
html[data-ui="3d"] .btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--teal) 62%,#000)}
html[data-ui="3d"] .subtabs button.on{box-shadow:0 4px 10px -4px color-mix(in srgb,var(--teal) 70%,#000)}
</style>
<style>
/* ===== "Camp" theme (rustic) — burlap background, cream paper cards, orange ribbon & buttons. Pick it in Home → Settings → Interface style, or via app_settings.brand.ui = "rustic" ===== */
html[data-ui="rustic"]{--ink:#4A4436;--ink-2:#7A7260;--line:#C9BF8E;--teal:#D06A2B;--teal-soft:#F3D9C2;--amber:#E88841;--amber-soft:#F6E2C8;--good:#4E7A2E;--bad:#B8432A;--bad-soft:#F4D7CC;--card:#E9E1AC;--paper:#5E4F3C}
html[data-ui="rustic"] body{background-color:#5E4F3C;
  background-image:
    repeating-linear-gradient(45deg, rgba(0,0,0,.18) 0 2px, transparent 2px 6px),
    repeating-linear-gradient(-45deg, rgba(255,240,210,.07) 0 2px, transparent 2px 6px),
    radial-gradient(rgba(0,0,0,.25) 1px, transparent 1.5px);
  background-size:8px 8px, 8px 8px, 4px 4px}
html[data-ui="rustic"] h1, html[data-ui="rustic"] h2, html[data-ui="rustic"] h3{font-family:"Cinzel","IBM Plex Sans Arabic",Georgia,serif;font-weight:700;color:#6F6550;letter-spacing:.04em}
html[data-ui="rustic"] .wrap > .grid > .row:first-child h1{color:#F3E9C6;text-shadow:0 2px 0 rgba(0,0,0,.4)}
/* top bar: charcoal with dark stripe, orange ribbon brand */
html[data-ui="rustic"] .bar{background:#252525;border-bottom:6px solid #1F1B16;height:60px;box-shadow:0 3px 0 #2E2E2E}
html[data-ui="rustic"] .brand{background:linear-gradient(#E88841,#D06A2B);color:#fff;font-family:"Cinzel",Georgia,serif;letter-spacing:.06em;padding:14px 22px 22px;margin-top:-2px;align-self:flex-start;
  clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);box-shadow:0 4px 10px rgba(0,0,0,.5)}
html[data-ui="rustic"] .brand span{color:#FFE7C7}
html[data-ui="rustic"] .tab{font-family:"Cinzel",Georgia,serif;font-weight:700;color:#E9E1AC;border-radius:0;padding:20px 12px}
html[data-ui="rustic"] .tab.on{background:#1A1A1A;color:#fff}
html[data-ui="rustic"] .ghost{border-color:rgba(233,225,172,.4);color:#E9E1AC}
/* cream paper cards with double inner rule */
html[data-ui="rustic"] .card{background:#E9E1AC;border:0;border-radius:3px;padding:22px;
  box-shadow:inset 0 0 0 7px #E9E1AC, inset 0 0 0 8px #8C8668, inset 0 0 0 10px #E9E1AC, inset 0 0 0 11px #8C8668, 0 10px 18px -8px rgba(0,0,0,.6)}
html[data-ui="rustic"] .card h2, html[data-ui="rustic"] .card h3{text-transform:uppercase;font-size:17px}
html[data-ui="rustic"] th{color:#6F6550;font-family:"Cinzel",Georgia,serif;font-weight:700;border-bottom-color:#B5AD83}
html[data-ui="rustic"] td{border-bottom-color:#D3CA98}
html[data-ui="rustic"] .score-row{border-bottom-color:#CFC594}
html[data-ui="rustic"] input, html[data-ui="rustic"] select, html[data-ui="rustic"] textarea{background:#fff;border:1px solid #C9C19A;border-radius:2px;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
/* orange buttons */
html[data-ui="rustic"] .btn{background:linear-gradient(#E88841,#C9611F);color:#fff;border-radius:2px;font-family:"Cinzel",Georgia,serif;letter-spacing:.04em;box-shadow:0 2px 0 #9C4A17}
html[data-ui="rustic"] .btn.sec{background:#D8CE95;color:#5A5240;box-shadow:0 2px 0 #B1A774}
html[data-ui="rustic"] .btn.warn{background:#E7B7A6;color:#7A2A17;box-shadow:none}
html[data-ui="rustic"] .subtabs button{background:#D8CE95;color:#5A5240;border-radius:2px;font-family:"Cinzel",Georgia,serif;font-weight:700}
html[data-ui="rustic"] .subtabs button.on{background:linear-gradient(#E88841,#C9611F);color:#fff}
/* hero = dark chalk board, like the camp countdown */
html[data-ui="rustic"] .mo{background:#252525;border-radius:3px;box-shadow:0 10px 18px -8px rgba(0,0,0,.7)}
html[data-ui="rustic"] .mo .big{color:#E88841;font-family:"Cinzel",Georgia,serif}
html[data-ui="rustic"] .chip{background:#F3D9C2;color:#9C4A17}
html[data-ui="rustic"] .chip.grey{background:#DCD3A1;color:#5A5240}
html[data-ui="rustic"] .bar-track{background:#D3CA98}
html[data-ui="rustic"] .stars{color:#D06A2B}
html[data-ui="rustic"] .stars i{color:#C9BF8E}
html[data-ui="rustic"] .muted{color:#7A7260}
html[data-ui="rustic"] .toast{background:#252525}
html[data-ui="rustic"] .wrap > .muted, html[data-ui="rustic"] .wrap > .grid > .muted{color:#E9E1AC}
html[data-ui="rustic"] .login .card{padding:34px}
html[data-ui="rustic"] body, html[data-ui="glass3d"] body{min-height:100vh}
html[data-ui="rustic"] .wrap > .grid > .row:first-child strong{color:#F3E9C6}
</style>
<style>
/* ===== "3D Glass" theme (glass3d) — slate-blue gradient, frosted glass cards, pastel pink→lavender 3D shapes, wide-spaced Lato ===== */
html[data-ui="glass3d"]{--ink:#F1F2FA;--ink-2:#BCC2DA;--line:rgba(255,255,255,.14);--card:rgba(255,255,255,.07);--paper:#3E4766;
  --teal:#E9B4C8;--teal-soft:rgba(233,180,200,.18);--amber:#C8B8EC;--amber-soft:rgba(200,184,236,.2);--good:#A8E6C8;--bad:#FFA3A3;--bad-soft:rgba(255,120,120,.16)}
html[data-ui="glass3d"] body{font-family:"Lato","IBM Plex Sans Arabic",system-ui,sans-serif;color:var(--ink);background:#3E4766;
  background-image:
    radial-gradient(260px 260px at 12% 30%, rgba(233,180,200,.35), transparent 70%),
    radial-gradient(220px 220px at 88% 12%, rgba(200,184,236,.35), transparent 70%),
    radial-gradient(320px 320px at 78% 85%, rgba(233,180,200,.25), transparent 70%),
    radial-gradient(200px 200px at 30% 92%, rgba(169,180,221,.3), transparent 70%),
    linear-gradient(135deg,#7A88AC 0%,#4C5779 45%,#232B40 100%);
  background-attachment:fixed}
html[data-ui="glass3d"] h1, html[data-ui="glass3d"] h2, html[data-ui="glass3d"] h3{font-family:"Lato","IBM Plex Sans Arabic",sans-serif;font-weight:300;text-transform:uppercase;letter-spacing:.22em;color:#fff}
html[data-ui="glass3d"] h1{font-size:30px}
html[data-ui="glass3d"] [dir=rtl] h1, html[dir=rtl][data-ui="glass3d"] h1, html[dir=rtl][data-ui="glass3d"] h2, html[dir=rtl][data-ui="glass3d"] h3{letter-spacing:0}
/* top bar */
html[data-ui="glass3d"] .bar{background:rgba(30,36,58,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.12);height:64px}
html[data-ui="glass3d"] .brand{display:flex;align-items:center;gap:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;font-size:14px}
html[data-ui="glass3d"] .brand::before{content:"";width:26px;height:26px;border:2.5px solid #fff;box-shadow:inset 6px 6px 0 -3.5px transparent;
  background:linear-gradient(#fff,#fff) 7px 9px/10px 2.5px no-repeat, linear-gradient(#fff,#fff) 7px 9px/2.5px 13px no-repeat, linear-gradient(#fff,#fff) 15px 9px/2.5px 13px no-repeat}
html[data-ui="glass3d"] .brand span{color:#E9B4C8;font-weight:300}

/* ---------- helpers ---------- */
const iso = d => d.toISOString().slice(0,10);
const today = () => iso(new Date());
const monthKey = d => d.slice(0,7)+"-01";
const thisMonth = () => monthKey(today());
const addMonths = (mk,n) => { const [y,m]=mk.split("-").map(Number); const d=new Date(Date.UTC(y,m-1+n,1)); return d.toISOString().slice(0,10); };
const qOf = mk => { const m=Number(mk.slice(5,7)); return {year:Number(mk.slice(0,4)), quarter:Math.floor((m-1)/3)+1, idx:(m-1)%3}; };

function makeEngine(D){ // D = {kpis, branches, pharmacists, assignments, targets, snaps, visits, pace}
  const paceMap={}; (D.pace||[]).forEach(r=>{ paceMap[r.day]=Number(r.weight); });
  // share of the month's sales expected by date asOf (weighted by the pace calendar; 1 per day if missing)
  const paceShare=(mk,asOf)=>{ const n=daysInMonth(mk); let tot=0, done=0;
    for(let d=1; d<=n; d++){ const ds=mk.slice(0,8)+String(d).padStart(2,"0"); const w=paceMap[ds]!=null?paceMap[ds]:1; tot+=w; if(ds<=asOf) done+=w; }
    return tot? done/tot : 0; };
  const tgt=(code,mk,bid,pid)=>{ const q=qOf(mk); const r=D.targets.find(x=>x.kpi_code===code&&x.year===q.year&&x.quarter===q.quarter&&(bid?x.branch_id===bid:x.pharmacist_id===pid)); return r? Number(r["m"+(q.idx+1)]) : null; };
  const snap=(code,mk,bid,pid)=>D.snaps.find(s=>s.kpi_code===code&&s.month===mk&&(bid?s.branch_id===bid:s.pharmacist_id===pid))||null;
  const kpisFor=mk=>{ const q=qOf(mk); return D.kpis.map(k=>{ const o=(D.schemes||[]).find(x=>x.kpi_code===k.code&&x.year===q.year&&x.quarter===q.quarter); return o? {...k,weight:o.weight,cap:o.cap,threshold:o.threshold??k.threshold,active:o.active} : k; }).sort((a,b)=>a.sort-b.sort); };

      const f=a.from_date>start?a.from_date:start; const t=a.to_date&&a.to_date<end?addDaysIso(a.to_date,1):end;

    // private label (Q4+): contribution = private-label sales ÷ the branch's actual sales, scored against threshold (e.g. 15% = full points)
    if(code==="private"&&Number(k.threshold)>0){ const sales=snap("sales",mk,bid,null);
      if(!s||!sales||!Number(sales.value)) return {ach:null};
      const mix=Number(s.value)/Number(sales.value);
      return {ach:mix/Number(k.threshold), actual:Number(s.value), mix, mixTarget:Number(k.threshold), contrib:true, asOf:s.as_of}; }

    if(!s&&t&&ZERO_IF_MISSING.includes(code)){ const ss=snap("sales",mk,bid,null); if(ss) return {ach:0, actual:0, target:t, asOf:ss.as_of, zero:true}; }
    if(!s||!t) return {ach:null, actual:s?Number(s.value):null, target:t};
    if(code==="sales"){ const actual=Number(s.value);
      if(s.as_of>=lastDayIso(mk)) return {ach:actual/t, actual, target:t, asOf:s.as_of, final:true};
      const share=paceShare(mk,s.as_of); if(!share) return {ach:actual/t, actual, target:t, asOf:s.as_of};
      const expected=t*share;
      return {ach:actual/expected, actual, target:t, expected, share, proj:actual/share, paced:true, asOf:s.as_of,
              stale:(new Date(today())-new Date(s.as_of))/864e5>8}; }
    return {ach:Number(s.value)/t, actual:Number(s.value), target:t, asOf:s.as_of}; }

  function phKpi(code,pid,mk){ const k=kpi(code,mk);
    if(k.level==="branch"){ const sh=shares(pid,mk); const ms=code==="sales"? snap("sales",mk,null,pid) : null; const mine=ms? Number(ms.value) : null;
      if(!sh.length) return {ach:null, mine};
      let ach=0, any=false, detail=[]; sh.forEach(x=>{ const r=branchKpi(code,x.branch_id,mk); if(r.ach!=null){ ach+=r.ach*x.share; any=true; } detail.push({...r,...x}); });
      const d0=detail[0]; return any? {ach, actual:d0.actual, target:d0.target, ratio:d0.ratio, asOf:d0.asOf, mixed:sh.length>1,
        expected:d0.expected, share:d0.share, proj:d0.proj, paced:d0.paced, stale:d0.stale, final:d0.final, mine, mix:d0.mix, mixTarget:d0.mixTarget, contrib:d0.contrib} : {ach:null, mine}; }
    if(k.rule==="visit"){ const vs=D.visits.filter(v=>v.pharmacist_id===pid&&monthKey(v.visit_date)===mk); if(!vs.length) return {ach:null};
      const avg=vs.reduce((a,v)=>a+Number(v.score),0)/vs.length; const vt=Number(k.threshold)||1;   // Q4: threshold 0.90 → 90% = full points
      return {ach:avg/vt, actual:avg, target:vt, unit:"rate", n:vs.length}; }
    const s=snap(code,mk,null,pid);
    if(k.rule==="rate"){ const t=tgt(code,mk,null,pid)||Number(k.threshold); if(!s||!Number(s.denominator)) return {ach:null,target:t,unit:"rate"};
      const rate=Number(s.numerator)/Number(s.denominator); return {ach:rate/t, actual:rate, target:t, unit:"rate", asOf:s.as_of}; }
    const t=tgt(code,mk,null,pid); if(!s||!t) return {ach:null, actual:s?Number(s.value):null, target:t};
    return {ach:Number(s.value)/t, actual:Number(s.value), target:t, asOf:s.as_of}; }

  // paced (mid-month) sales points are capped at full weight
  const pts=(k,ach,paced)=> ach==null? null : Number(k.weight)*Math.min(ach, paced?1:(k.cap==null?Infinity:Number(k.cap)));
  function pharmacistScore(pid,mk){ const rows=kpisFor(mk).filter(k=>k.active).map(k=>{ const r=phKpi(k.code,pid,mk); return {k,...r,pts:pts(k,r.ach,r.paced)}; });
    const has=rows.filter(r=>r.pts!=null); const sr=rows.find(r=>r.k.code==="sales");
    return {rows, total: has.length? has.reduce((a,r)=>a+r.pts,0):null, covered: has.reduce((a,r)=>a+Number(r.k.weight),0), salesAch:sr?sr.ach:null}; }
  function branchScore(bid,mk){ const phs=D.pharmacists.filter(p=>scored(p)&&shares(p.id,mk).some(s=>s.branch_id===bid));
    const rows=kpisFor(mk).filter(k=>k.active).map(k=>{ if(k.level==="branch"){ const r=branchKpi(k.code,bid,mk); return {k,...r,pts:pts(k,r.ach,r.paced)}; }
      const vals=phs.map(p=>{ const r=phKpi(k.code,p.id,mk); return pts(k,r.ach,r.paced); }).filter(v=>v!=null); return {k, ach:null, pts: vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null, n:vals.length}; });
    const has=rows.filter(r=>r.pts!=null); const sr=rows.find(r=>r.k.code==="sales");
    return {rows, total: has.length? has.reduce((a,r)=>a+r.pts,0):null, phs, salesAch:sr?sr.ach:null}; }
  function quarterAvg(fn,id,mk){ const q=qOf(mk); const ms=[0,1,2].map(i=>addMonths(mk,i-q.idx)).map(m=>fn(id,m).total).filter(x=>x!=null); return ms.length? ms.reduce((a,b)=>a+b,0)/ms.length : null; }
  return {shares, pharmacistScore, branchScore, quarterAvg, kpisFor};
}

}

function PharmacistReport({t,D,E,lang,pid,startMk,onClose}){
  const L=(en,ar)=>lang==="ar"?ar:en;
  const ph=D.pharmacists.find(p=>p.id===pid)||{};

  const [from,setFrom]=useState(qStart.slice(0,7)); const [to,setTo]=useState((startMk<thisMonth()?startMk:thisMonth()).slice(0,7));
  const ref=React.useRef(null);
  useEffect(()=>{ document.body.classList.add("rep-open"); return ()=>document.body.classList.remove("rep-open"); },[]);
  const setPreset=k=>{ const cur=thisMonth(), q=qOf(cur);
    const qs=(y,qq)=>`${y}-${String(qq*3-2).padStart(2,"0")}`;
    if(k==="month"){ setFrom(cur.slice(0,7)); setTo(cur.slice(0,7)); }
    if(k==="quarter"){ setFrom(qs(q.year,q.quarter)); setTo(cur.slice(0,7)); }

    if(k==="year"){ setFrom(`${q.year}-01`); setTo(cur.slice(0,7)); } };

  // months in the period (max 24)
  const months=[]; if(from&&to&&from<=to){ let m=from+"-01"; while(m<=to+"-01"&&months.length<24){ months.push(m); m=addMonths(m,1); } }
  const data=months.map(m=>({m,...E.pharmacistScore(pid,m),branches:E.shares(pid,m).map(x=>bname(D.branches,x.branch_id)).join(" ⇄ ")}));
  // KPI columns = every active KPI used in any month of the period

  // branch revenue: target vs actual per month (sales KPI is branch level)
  const salesRows=data.map(d=>{ const r=d.rows.find(x=>x.k.code==="sales")||{};
    return {m:d.m, branch:d.branches, target:r.target!=null?Number(r.target):null, actual:r.actual!=null?Number(r.actual):null,
      ach:r.target&&r.actual!=null? Number(r.actual)/Number(r.target) : null, mine:r.mine!=null?Number(r.mine):null, final:!!r.final, asOf:r.asOf}; });
  const sumOf=k=>salesRows.reduce((a,r)=>a+(r[k]||0),0);
  const tgtTot=sumOf("target"), actTot=sumOf("actual"), mineTot=sumOf("mine");
  const fromD=from+"-01", toD=lastDayIso(to+"-01");
  const visits=D.visits.filter(v=>v.pharmacist_id===pid&&v.visit_date>=fromD&&v.visit_date<=toD).sort((a,b)=>a.visit_date<b.visit_date?-1:1);
  const branchesAll=[...new Set(data.map(d=>d.branches).filter(Boolean).join(" ⇄ ").split(" ⇄ ").filter(x=>x&&x!=="—"))].join(", ")||"—";
  const pctCls=a=>a==null?"":a>=1?"good":a>=0.7?"mid":"bad";

      <label>{L("From","من")}<input type="month" value={from} max={thisMonth().slice(0,7)} onChange={e=>e.target.value&&setFrom(e.target.value)}/></label>

      <div className="rhead">
        <div><h2>{L("Pharmacist performance report","تقرير أداء الصيدلي")}</h2><div style={{color:"#555"}}>{t.app} · {L("KPI system","نظام مؤشرات الأداء")}</div></div>
        <div style={{textAlign:"end"}}><div><b>{periodTxt}</b></div><div style={{color:"#666",fontSize:12}}>{L("Printed","تاريخ الطباعة")}: {printedOn}</div></div>
      </div>
      <div className="rmeta">
        <div><span>{t.pharmacist}</span><b>{ph.full_name||"—"}</b></div>
        <div><span>{t.empCode}</span><b>{ph.emp_code||"—"}</b></div>
        <div><span>{t.branch}</span><b>{branchesAll}</b></div>
        <div><span>{t.title}</span><b>{({"community pharmacist":t.tPh,"on-call pharmacist":L("On-call pharmacist (joker)","صيدلي جوكر (متنقل)"),"pharmacy manager":t.tPm,supervisor:t.tSup,management:t.tMgmt})[ph.title]||ph.title||"—"}</b></div>
      </div>

      {months.length===0 ? <p style={{color:"#C62828"}}>{L("Choose a valid period (From must be before To).","اختر فترة صحيحة (بداية الفترة قبل نهايتها).")}</p> : <>
      <div className="rsum">
        <div><span>{L("Average score","متوسط النقاط")}</span><b className={pctCls(avg==null?null:avg/100)}>{avg==null?"—":avg.toFixed(1)}<small style={{fontSize:12,color:"#666"}}> / 100</small></b><Stars n={starsOf(avg)}/></div>
        <div><span>{L("Best month","أفضل شهر")}</span><b>{best?best.total.toFixed(1):"—"}</b><span>{best?monthLabel(best.m,lang):""}</span></div>
        <div><span>{L("Months with data","أشهر بها بيانات")}</span><b>{scoredMonths.length} / {months.length}</b></div>
        <div><span>{t.mySales} ({t.sar})</span><b>{mySales?fmt(mySales):"—"}</b></div>
        <div><span>{L("Branch revenue target","هدف إيراد الفرع")} ({t.sar})</span><b>{tgtTot?fmt(tgtTot):"—"}</b>{tgtTot?<span className={pctCls(actTot/tgtTot)}>{Math.round(actTot/tgtTot*100)}% {L("achieved","محقق")}</span>:null}</div>
      </div>

      <h3>{L("Branch revenue vs target","إيراد الفرع مقابل الهدف")}</h3>
      <table><thead><tr><th className="l">{t.month}</th><th className="l">{t.branch}</th><th>{L("Revenue target","هدف الإيراد")}</th><th>{L("Actual revenue","الإيراد الفعلي")}</th><th>{t.ach}</th><th>{t.mySales}</th><th>{L("Share of branch","النسبة من الفرع")}</th></tr></thead>
        <tbody>{salesRows.map(r=><tr key={r.m}><td className="l"><b>{monthLabel(r.m,lang)}</b>{r.actual!=null&&!r.final&&r.asOf?<div style={{fontSize:11,color:"#666"}}>{t.asOf} {r.asOf}</div>:null}</td>
          <td className="l">{r.branch||"—"}</td><td>{r.target==null?L("Not set","غير محدد"):fmt(r.target)}</td><td>{r.actual==null?"—":fmt(r.actual)}</td>
          <td><b className={pctCls(r.ach)}>{r.ach==null?"—":Math.round(r.ach*100)+"%"}</b></td><td>{r.mine==null?"—":fmt(r.mine)}</td>
          <td>{r.mine!=null&&r.actual?Math.round(r.mine/r.actual*100)+"%":"—"}</td></tr>)}
          <tr className="tfoot"><td className="l" colSpan="2">{L("Period total","إجمالي الفترة")}</td><td>{tgtTot?fmt(tgtTot):"—"}</td><td>{actTot?fmt(actTot):"—"}</td>
            <td>{tgtTot?Math.round(actTot/tgtTot*100)+"%":"—"}</td><td>{mineTot?fmt(mineTot):"—"}</td><td>{mineTot&&actTot?Math.round(mineTot/actTot*100)+"%":"—"}</td></tr>
        </tbody></table>
      <div style={{fontSize:11,color:"#666",marginTop:4}}>{L("Achievement here is actual ÷ the full monthly target. The score table uses progress to date for the current month.","التحقق هنا = الفعلي ÷ هدف الشهر كاملًا. جدول النقاط يحسب الشهر الحالي على الإنجاز حتى تاريخه.")}</div>

      <h3>{L("Monthly scores","النقاط الشهرية")}</h3>
      <div style={{overflowX:"auto"}}><table>
        <thead><tr><th className="l">{t.month}</th>{cols.map(k=><th key={k.code}>{kname(k,lang)}</th>)}<th>{t.score}</th><th>{L("Stars","النجوم")}</th></tr></thead>
        <tbody>{data.map(d=><tr key={d.m}><td className="l"><b>{monthLabel(d.m,lang)}</b><div style={{fontSize:11,color:"#666"}}>{d.branches||"—"}</div></td>
          {cols.map(k=>{ const r=d.rows.find(x=>x.k.code===k.code); return <td key={k.code}>{!r||r.pts==null?"—":<><b>{r.pts.toFixed(1)}</b><span style={{color:"#888"}}>/{r.k.weight}</span><div className={pctCls(r.ach)} style={{fontSize:11}}>{Math.round(r.ach*100)}%</div></>}</td>; })}
          <td><b className={pctCls(d.total==null?null:d.total/100)}>{d.total==null?"—":d.total.toFixed(1)}</b></td><td><Stars n={starsOf(d.total)}/></td></tr>)}
          <tr className="tfoot"><td className="l">{L("Period average","متوسط الفترة")}</td>{kpiSum.map(x=><td key={x.k.code}>{x.pts==null?"—":x.pts.toFixed(1)}</td>)}<td>{avg==null?"—":avg.toFixed(1)}</td><td><Stars n={starsOf(avg)}/></td></tr>
        </tbody></table></div>

      <h3>{L("KPI summary for the period","ملخص المؤشرات خلال الفترة")}</h3>
      <table><thead><tr><th className="l">{t.kpiCol}</th><th>{t.level}</th><th>{t.weight}</th><th>{L("Months","الأشهر")}</th><th>{L("Avg. achievement","متوسط التحقق")}</th><th>{L("Avg. points","متوسط النقاط")}</th></tr></thead>
        <tbody>{kpiSum.map(x=><tr key={x.k.code}><td className="l">{kname(x.k,lang)}</td><td>{x.k.level==="branch"?t.branch:t.pharmacist}</td><td>{Number(x.w).toFixed(0)}</td><td>{x.n}</td>
          <td><b className={pctCls(x.ach)}>{x.ach==null?"—":Math.round(x.ach*100)+"%"}</b></td><td>{x.pts==null?"—":x.pts.toFixed(1)}</td></tr>)}</tbody></table>

      {visits.length>0 && <><h3>{L("Visit reports in the period","تقارير الزيارات خلال الفترة")}</h3>
        <table><thead><tr><th>{t.date}</th><th>{t.branch}</th><th>{VT[lang].vtype}</th><th>{t.score}</th><th>{VT[lang].decision}</th><th className="l">{VT[lang].priorities}</th></tr></thead>
          <tbody>{visits.map(v=><tr key={v.id}><td>{v.visit_date}</td><td>{bname(D.branches,v.branch_id)}</td><td>{VT[lang][v.visit_type]||"—"}</td>
            <td><b className={pctCls(v.score)}>{v.total_points!=null?v.total_points:Math.round(Number(v.score)*100)} / 100</b></td>
            <td>{({pass:VT[lang].d1,photos:VT[lang].d2,training:VT[lang].d3,revisit:VT[lang].d4})[v.decision]||"—"}</td><td className="l">{v.priorities||""}</td></tr>)}</tbody></table></>}
      </>}

      <div className="sign"><div>{L("Supervisor signature","توقيع المشرف")}</div><div>{L("Pharmacist signature","توقيع الصيدلي")}</div></div>
      <div className="foot">{L("Branch-level KPIs (sales, expiry…) are the branch's result and are shared by every pharmacist in it. The current month is scored on progress to date.","مؤشرات مستوى الفرع (المبيعات، المنتهي…) هي نتيجة الفرع ويشترك فيها كل صيادلة الفرع. الشهر الحالي محسوب على الإنجاز حتى تاريخه.")}</div>
    </div>
  </div>, document.body);
}

function Dashboard({t,me,D,E,lang}){
  const isAdmin=me.role==="admin", isPh=me.role==="pharmacist"; const [mk,setMk]=useState(thisMonth());
  const myRec=D.pharmacists.find(p=>p.id===me.pharmacist_id);
  const lockedBranch = isAdmin? null : isPh? ((me.pharmacist_id&&E.shares(me.pharmacist_id,mk)[0]?.branch_id)||myRec?.branch_id||null) : (me.branch_id||null);
  const [view,setView]=useState(isPh?"pharmacist":"branch");
  const [bid,setBid]=useState(lockedBranch||D.branches[0]?.id||"");
  useEffect(()=>{ if(lockedBranch&&bid!==lockedBranch) setBid(lockedBranch); },[lockedBranch]);
  const phPool = isPh? D.pharmacists.filter(p=>p.id===me.pharmacist_id) : D.pharmacists.filter(p=>scored(p)&&(view!=="pharmacist"||!bid||E.shares(p.id,mk).some(s=>s.branch_id===bid)));
  const [pid,setPid]=useState(isPh?me.pharmacist_id:"");
  useEffect(()=>{ if(!phPool.find(p=>p.id===pid)) setPid(phPool[0]?.id||""); },[bid,mk,view]);
  const canOpen=p=>!isPh||p.id===me.pharmacist_id;
  const [repOpen,setRepOpen]=useState(false);
  const months6=[5,4,3,2,1,0].map(i=>addMonths(mk,-i));

  let hero=null, rows=[], sparks=[], extra=null, qr=null;
  if(view==="pharmacist"&&pid){ const s=E.pharmacistScore(pid,mk); const prev=E.pharmacistScore(pid,addMonths(mk,-1)).total; rows=s.rows;
    hero={title:D.pharmacists.find(p=>p.id===pid)?.full_name, sub:E.shares(pid,mk).map(x=>bname(D.branches,x.branch_id)).join(" ⇄ ")||"—", total:s.total, prev, q:E.quarterAvg(E.pharmacistScore,pid,mk), covered:s.covered};
    sparks=months6.map(m=>E.pharmacistScore(pid,m).total);
    qr=<QuarterResults t={t} D={D} lang={lang} pids={[pid]} detail/>; }
  if(view==="branch"&&bid){ const s=E.branchScore(bid,mk); const prev=E.branchScore(bid,addMonths(mk,-1)).total; rows=s.rows;
    hero={title:bname(D.branches,bid), sub:`${s.phs.length} ${t.pharmacists}`, total:s.total, prev, q:E.quarterAvg(E.branchScore,bid,mk)};
    sparks=months6.map(m=>E.branchScore(bid,m).total);
    const rank=s.phs.map(p=>({p,...E.pharmacistScore(p.id,mk)})).sort(byScore);
    extra=<div className="card"><h3 style={{marginBottom:8}}>{t.ranking} · {t.pharmacists}</h3><table className="rank"><tbody>{rank.map((r,i)=><tr key={r.p.id}><td>{i+1}</td>
      <td>{canOpen(r.p)? <a href="#" onClick={e=>{e.preventDefault();setView("pharmacist");setPid(r.p.id);}}>{r.p.full_name}</a> : r.p.full_name}</td>
      <td><Stars n={starsOf(r.total)}/></td><td className="num"><strong>{r.total==null?"—":r.total.toFixed(1)}</strong></td></tr>)}</tbody></table></div>;
    if(!isPh) qr=<QuarterResults t={t} D={D} lang={lang} pids={s.phs.map(p=>p.id)}/>; }
  if(view==="company"&&isAdmin){ const rank=D.branches.map(b=>{ const s=E.branchScore(b.id,mk); return {b,s,total:s.total,salesAch:s.salesAch,prev:E.branchScore(b.id,addMonths(mk,-1)).total}; }).sort(byScore);
    const has=rank.filter(r=>r.s.total!=null); const total=has.length?has.reduce((a,r)=>a+r.s.total,0)/has.length:null;
    const hasP=rank.filter(r=>r.prev!=null); const prev=hasP.length?hasP.reduce((a,r)=>a+r.prev,0)/hasP.length:null;
    hero={title:t.company, sub:`${D.branches.length} ${t.branches}`, total, prev, q:null};
    sparks=months6.map(m=>{ const v=D.branches.map(b=>E.branchScore(b.id,m).total).filter(x=>x!=null); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; });
    const stars=D.pharmacists.filter(scored).map(p=>({p,q:E.quarterAvg(E.pharmacistScore,p.id,mk)})).filter(x=>x.q!=null).sort((a,b)=>b.q-a.q);
    const curQ=qOf(thisMonth()), selQ=qOf(mk); const starCard=(selQ.year!==curQ.year||selQ.quarter!==curQ.quarter)? null : <div className="card"><div className="row" style={{justifyContent:"space-between"}}><h3>{t.stars} · Q{qOf(mk).quarter} {qOf(mk).year}</h3><span className="muted small">{t.starsHint}</span></div>
      <table className="rank"><tbody>{stars.slice(0,10).map((x,i)=><tr key={x.p.id}><td>{i+1}</td><td>{x.p.full_name}<div className="muted small">{bname(D.branches,x.p.branch_id)}</div></td><td><Stars n={starsOf(x.q)}/></td><td className="num"><strong>{x.q.toFixed(1)}</strong></td><td className="num">{i===0?<span className="chip amber">★ 1,500</span>:i===1?<span className="chip amber">★ 1,000</span>:null}</td></tr>)}</tbody></table></div>;
    extra=<><div className="card" style={{overflowX:"auto"}}><h3 style={{marginBottom:8}}>{t.ranking} · {t.branches}</h3><table className="rank"><thead><tr><th></th><th>{t.branch}</th>{E.kpisFor(mk).filter(k=>k.active).map(k=><th key={k.code} className="num">{kname(k,lang)}</th>)}<th className="num">{t.score}</th><th></th></tr></thead><tbody>
      {rank.map((r,i)=><tr key={r.b.id}><td>{i+1}</td><td><a href="#" onClick={e=>{e.preventDefault();setView("branch");setBid(r.b.id);}}>{r.b.name}</a></td>
        {r.s.rows.map(x=><td key={x.k.code} className="num">{x.pts==null?"—":x.pts.toFixed(1)}{x.paced&&<div className={"small "+(x.ach>=1?"":"")} style={{color:x.ach>=1?"var(--good)":x.ach>=0.85?"var(--amber)":"var(--bad)"}}>{Math.round(x.ach*100)}%</div>}</td>)}
        <td className="num"><strong>{r.s.total==null?"—":r.s.total.toFixed(1)}</strong></td><td><Stars n={starsOf(r.s.total)}/></td></tr>)}</tbody></table></div>{starCard}</>;
    qr=<QuarterResults t={t} D={D} lang={lang} pids={D.pharmacists.map(p=>p.id)}/>; }

  const vBranch = view==="pharmacist"&&pid ? (E.shares(pid,mk)[0]||{}).branch_id : view==="branch"? bid : null;
  const vList = vBranch? D.visits.filter(x=>x.branch_id===vBranch&&monthKey(x.visit_date)===mk) : [];
  const visitCard = vBranch && vList.length>0 ? <div className="card"><h3 style={{marginBottom:8}}>{t.visitResults} · {bname(D.branches,vBranch)}</h3>
    <table><thead><tr><th>{t.date}</th><th>{t.pharmacist}</th><th>{VT[lang].vtype}</th><th className="num">{t.score}</th><th>{VT[lang].decision}</th><th>{VT[lang].priorities}</th></tr></thead><tbody>
    {vList.map(x=><tr key={x.id}><td>{x.visit_date}</td><td>{D.pharmacists.find(p=>p.id===x.pharmacist_id)?.full_name||"—"}</td><td className="small muted">{VT[lang][x.visit_type]||""}</td><td className="num"><span className={"pct "+tone(x.score)} style={{fontSize:15}}>{x.total_points!=null?x.total_points:Math.round(x.score*100)} / 100</span></td><td className="small">{({pass:VT[lang].d1,photos:VT[lang].d2,training:VT[lang].d3,revisit:VT[lang].d4})[x.decision]||""}</td><td className="small muted">{x.priorities}</td></tr>)}</tbody></table></div> : null;
  const delta = hero&&hero.total!=null&&hero.prev!=null? hero.total-hero.prev : null;
  return <div className="grid">
    <div className="row" style={{justifyContent:"space-between"}}><h1>{t.dash}</h1><MonthPicker mk={mk} set={setMk} lang={lang}/></div>
    <div className="row">
      <div className="subtabs">{isAdmin&&<button className={view==="company"?"on":""} onClick={()=>setView("company")}>{t.company}</button>}<button className={view==="branch"?"on":""} onClick={()=>setView("branch")}>{t.branch}</button><button className={view==="pharmacist"?"on":""} onClick={()=>setView("pharmacist")}>{t.pharmacist}</button></div>
      {view!=="company" && !lockedBranch && <select value={bid} onChange={e=>setBid(e.target.value)} style={{width:"auto"}}>{view==="pharmacist"&&<option value="">{t.allBranches}</option>}{D.branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}</select>}
      {view==="pharmacist" && !isPh && <select value={pid} onChange={e=>setPid(e.target.value)} style={{width:"auto"}}>{phPool.map(p=><option key={p.id} value={p.id}>{p.full_name}</option>)}</select>}
      {view==="pharmacist" && pid && <button className="btn sec" onClick={()=>setRepOpen(true)}>🖨 {lang==="ar"?"تقرير لفترة":"Period report"}</button>}
    </div>
    {repOpen && view==="pharmacist" && pid && <PharmacistReport t={t} D={D} E={E} lang={lang} pid={pid} startMk={mk} onClose={()=>setRepOpen(false)}/>}
    {!hero ? <div className="card empty">{t.noData}</div> : <>
    <div className="hero">
      <div className="mo">
        <IsoArt/>
        <div><div className="small" style={{color:"#CFE0DC"}}>{hero.sub}</div><div style={{fontWeight:600,marginTop:6}}>{hero.title} <Stars n={starsOf(hero.total)}/></div></div>
        <div><div className="big">{hero.total==null?"—":hero.total.toFixed(0)}<small> / 100</small></div>
          <div className={"delta "+(delta==null?"flat":delta>0?"up":delta<0?"down":"flat")}>{delta==null?"■ —":(delta>0?"▲ ":delta<0?"▼ ":"■ ")+Math.abs(delta).toFixed(1)} <span style={{fontWeight:400,color:"#CFE0DC"}}>{t.vsPrev}</span>{hero.q!=null&&<span style={{fontWeight:400,color:"#CFE0DC"}}> · {t.qAvg} {hero.q.toFixed(1)}</span>}</div></div>
      </div>
      <div className="card"><h3>{t.momentum}</h3><Spark points={sparks}/><div className="row small muted" style={{justifyContent:"space-between"}}>{months6.map(m=><span key={m}>{new Date(m+"T00:00:00").toLocaleDateString(lang==="ar"?"ar-SA":"en-GB",{month:"short"})}</span>)}</div></div>
    </div>
    {view!=="company" && <div className="card"><ScoreRows rows={rows} t={t} lang={lang}/></div>}
    {visitCard}
    {extra}
    {qr}
    </>}
  </div>;
}

/* ================= JULEB IMPORT (super admin, or accounts with "Import Juleb report" ticked in Admin) =================
   Report: Juleb → POS Sales Details · all branches · any date range · Excel.
   1) every sale line is stored in sales_lines (same line never stored twice — overlapping uploads are safe)
   2) kpi_refresh() recalculates month-to-date KPIs from all stored lines of that month (as of the last stored day):
      sales per branch · my sales · registration (phone ≥9 digits ÷ all bills, returns excluded) · lab · private label
   The same lines feed the Marketing page. */
const canImport = me => !!me && (me.is_super || (me.pages||[]).includes("dataImport"));
const JULEB_REQ=["Branch Code","Branch Name","Cashier","Receipt Reference","Total Amount","Phone","Order Date Time"];
const isoLocal=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const tsLocal=d=>`${isoLocal(d)}T${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`;
function toIsoDate(v){ if(v==null||v==="") return null; if(v instanceof Date) return isoLocal(v);
  const s=String(v).trim(); let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/); if(m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; return null; }
const toTs=v=> v instanceof Date? tsLocal(v) : (String(v??"").trim().replace(" ","T")||null);
function parseJuleb(buf,D){
  const wb=XLSX.read(buf,{type:"array",cellDates:true}); const ws=wb.Sheets[wb.SheetNames[0]];
  const A=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  const h=A.findIndex(r=>r&&String(r[0]??"").trim()==="Branch Code"); if(h<0) throw new Error("Not a POS Sales Details export (no 'Branch Code' header row).");
  const H=A[h].map(x=>String(x??"").trim()); const miss=JULEB_REQ.filter(c=>!H.includes(c)); if(miss.length) throw new Error("Missing columns: "+miss.join(", "));
  const c=n=>H.indexOf(n); const g=(r,n)=>{ const i=c(n); return i<0? null : r[i]; }; const str=v=> v==null||v===""? null : String(v).trim();
  let endDate=null, startDate=null;
  for(let i=0;i<h;i++){ (A[i]||[]).forEach((x,j)=>{ const lab=String(x??"").toLowerCase().trim(); const below=(A[i+1]||[])[j];
    if(lab==="end date") endDate=toIsoDate(below)||endDate; if(lab==="start date") startDate=toIsoDate(below)||startDate; }); }
  const rows=A.slice(h+1).filter(r=>r&&String(r[c("Branch Code")]??"").startsWith("PH"));
  if(!rows.length) throw new Error("No sales rows found.");
  const lineNo={}, lines=[], sales={}, bills={};
  rows.forEach(r=>{ const br=str(g(r,"Branch Name")), rc=str(g(r,"Receipt Reference")); const key=br+"|"+rc; lineNo[key]=(lineNo[key]||0)+1;
    const d=toIsoDate(g(r,"Order Date Time")); const pm=str(g(r,"Payment Method"))||""; const total=Number(g(r,"Total Amount"))||0;
    const ph=String(g(r,"Phone")??"").replace(/\D/g,"")||null; const pref=g(r,"Product Ref"); const ca=str(g(r,"Cashier"));
    lines.push({branch_name:br,receipt_ref:rc,line_no:lineNo[key],order_at:toTs(g(r,"Order Date Time")),order_date:d,cashier:ca,customer:str(g(r,"Customer")),phone:ph,
      product_ref:pref==null||pref===""?null:String(typeof pref==="number"?Math.round(pref):pref).trim(),product_name:str(g(r,"Product Name")),product_name_ar:str(g(r,"Product Name Arabic")),
      category:str(g(r,"Category")),category2:str(g(r,"Category 2")),category3:str(g(r,"Category 3")),qty:Number(g(r,"Sold Qty"))||0,total,payment_method:pm||null,is_wasfaty:/wasfaty/i.test(pm)});
    sales[br]=(sales[br]||0)+total; const b=bills[key]||(bills[key]={ca,tot:0,ph:false}); b.tot+=total; if(ph&&ph.length>=9&&!/^wasfaty/i.test(String(g(r,"Customer")??"").trim())) b.ph=true; });
  const dates=lines.map(l=>l.order_date).filter(Boolean).sort(); const minD=dates[0], maxD=dates[dates.length-1];
  const months=[...new Set(dates.map(monthKey))];
  const reg={}; Object.values(bills).filter(b=>b.tot>0).forEach(b=>{ const x=reg[b.ca]||(reg[b.ca]={n:0,r:0}); x.n++; if(b.ph) x.r++; });
  const unB=Object.keys(sales).filter(n=>!D.branches.some(b=>(b.juleb_name||"").trim()===n));
  const unP=Object.keys(reg).filter(n=>!D.pharmacists.some(p=>(p.juleb_name||"").trim()===n));
  return {lines,months,startDate:startDate||minD,endDate:endDate||maxD,rowsN:rows.length,billsN:Object.keys(bills).length,sales,reg,unB,unP};
}
// Juleb → Internal Transfer Summary (done transfers). Expired = transfers TO the expiry warehouse, at Total Avg Cost.
function parseTransfers(A,D){
  const h=A.findIndex(r=>r&&String(r[0]??"").trim()==="Transfer From (Source Branch)");
  const H=A[h].map(x=>String(x??"").trim()); const need=["Transfer From (Source Branch)","Transfer To (Destination Branch)","Transfer Name","Transfer Date","Total Avg Cost"];
  const miss=need.filter(c=>!H.includes(c)); if(miss.length) throw new Error("Missing columns: "+miss.join(", "));
  const g=(r,n)=>{ const i=H.indexOf(n); return i<0?null:r[i]; };
  let endDate=null, startDate=null;
  for(let i=0;i<h;i++){ (A[i]||[]).forEach((x,j)=>{ const lab=String(x??"").toLowerCase().trim(); const below=(A[i+1]||[])[j];
    if(lab==="end date") endDate=toIsoDate(below)||endDate; if(lab==="start date") startDate=toIsoDate(below)||startDate; }); }
  const all=A.slice(h+1).filter(r=>r&&g(r,"Transfer Name")!=null&&String(g(r,"Transfer Name")).trim()!=="");   // drops the totals row
  const exp=all.filter(r=>/expir/i.test(String(g(r,"Transfer To (Destination Branch)")??""))&&String(g(r,"Status")??"done").toLowerCase()==="done")
    .map(r=>({transfer_name:String(g(r,"Transfer Name")).trim(),source_branch:String(g(r,"Transfer From (Source Branch)")??"").trim(),
      dest_branch:String(g(r,"Transfer To (Destination Branch)")??"").trim(),transfer_date:toIsoDate(g(r,"Transfer Date")),
      qty:Number(g(r,"Total QTY"))||0,cost:Number(g(r,"Total Avg Cost"))||0,status:String(g(r,"Status")??"done").trim()}));
  const by={}; exp.forEach(x=>{ by[x.source_branch]=(by[x.source_branch]||0)+x.cost; });
  const dates=[startDate,endDate,...exp.map(x=>x.transfer_date)].filter(Boolean).sort();
  let months=[]; for(let m=monthKey(dates[0]); m<=monthKey(dates[dates.length-1]); m=addMonths(m,1)) months.push(m);
  const unB=Object.keys(by).filter(n=>!D.branches.some(b=>(b.juleb_name||"").trim()===n));
  return {kind:"expiry",exp,allN:all.length,by,months,startDate:startDate||dates[0],endDate:endDate||dates[dates.length-1],unB};
}
function parseAny(buf,D){
  const wb=XLSX.read(buf,{type:"array",cellDates:true}); const A=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null});
  if(A.some(r=>r&&String(r[0]??"").trim()==="Transfer From (Source Branch)")) return parseTransfers(A,D);
  return {kind:"sales",...parseJuleb(buf,D)};
}
function JulebImport({t,D,reload,toast}){
  const [res,setRes]=useState(null); const [err,setErr]=useState(""); const [busy,setBusy]=useState(""); const [done,setDone]=useState(null);
  const onFile=async e=>{ const f=e.target.files[0]; e.target.value=""; if(!f) return; setErr(""); setRes(null); setDone(null);
    try{ setRes(parseAny(await f.arrayBuffer(),D)); }catch(x){ setErr(String(x.message||x)); } };
  const refresh=async months=>{ const out=[]; for(const m of months){ setBusy(`Recalculating ${m.slice(0,7)}…`);
      const r=await sb.rpc("kpi_refresh",{p_month:m}); if(r.error) throw new Error(r.error.message); out.push(r.data); } return out; };
  const save=async()=>{ try{
      if(res.kind==="expiry"){ if(res.exp.length){ setBusy("Saving expiry transfers…");
          const r=await sb.from("expiry_transfers").upsert(res.exp,{onConflict:"transfer_name"}); if(r.error) throw new Error(r.error.message); }
        const out=await refresh(res.months); setDone(out); setRes(null); toast(t.saved); reload(); setBusy(""); return; }
      const L=res.lines; for(let i=0;i<L.length;i+=1000){ setBusy(`Saving lines ${Math.min(i+1000,L.length).toLocaleString()} / ${L.length.toLocaleString()}…`);
        const r=await sb.from("sales_lines").upsert(L.slice(i,i+1000),{onConflict:"branch_name,receipt_ref,line_no"}); if(r.error) throw new Error(r.error.message); }
      const out=await refresh(res.months); setDone(out); setRes(null); toast(t.saved); reload();
    }catch(x){ toast(String(x.message||x)); } setBusy(""); };
  const refreshOnly=async()=>{ try{ setDone(await refresh([thisMonth()])); toast(t.saved); reload(); }catch(x){ toast(String(x.message||x)); } setBusy(""); };
  const bByJ=n=>D.branches.find(b=>(b.juleb_name||"").trim()===n);
  return <div className="card grid">
    <div className="row" style={{justifyContent:"space-between"}}><h2>Import Juleb report</h2>
      <div className="row" style={{gap:8}}><button className="btn sec" disabled={!!busy} onClick={refreshOnly} title="Recalculate this month from stored lines">↻ Recalculate this month</button>
        <label className="btn" style={{cursor:"pointer"}}>Choose .xlsx<input type="file" accept=".xlsx,.xls" onChange={onFile} style={{display:"none"}} disabled={!!busy}/></label></div></div>
    <div className="muted small">Juleb → <b>POS Sales Details</b> or <b>Internal Transfer Summary</b> (done transfers, all branches incl. Expiry WH) · all branches · <b>any dates</b> · export Excel. The file type is detected automatically. Every line is stored once — overlapping uploads are safe — and the month-to-date KPIs are recalculated from all stored lines. The same lines feed Marketing.</div>
    {err && <div className="err">{err}</div>}
    {busy && <div className="chip amber">{busy}</div>}
    {res && res.kind==="expiry" && <>
      <div className="row small"><span className="chip">Internal Transfer Summary · {res.startDate} → {res.endDate}</span><span className="chip grey">{res.allN} transfers · {res.exp.length} to expiry warehouse</span></div>
      {res.unB.length>0 && <div className="err">Not matched — set their Juleb name in Team: {res.unB.join(" · ")}</div>}
      {res.exp.length===0? <div className="chip">No transfers to the expiry warehouse in this period — every branch keeps full expiry points.</div> :
        <table><thead><tr><th>{t.branch}</th><th className="num">Expired (cost)</th><th className="num">Transfers</th></tr></thead><tbody>
          {Object.entries(res.by).sort((a,b)=>b[1]-a[1]).map(([n,v])=><tr key={n}><td>{bByJ(n)?.name||<span className="chip bad">{n}</span>}</td><td className="num">{v.toLocaleString("en",{maximumFractionDigits:2})}</td><td className="num">{res.exp.filter(x=>x.source_branch===n).length}</td></tr>)}</tbody></table>}
      <div className="row"><button className="btn" disabled={!!busy} onClick={save}>Save expiry & update KPIs</button><button className="btn sec" disabled={!!busy} onClick={()=>setRes(null)}>{t.cancel}</button></div>
    </>}
    {res && res.kind==="sales" && <>
      <div className="row small"><span className="chip">{res.startDate} → {res.endDate}</span><span className="chip grey">{res.rowsN.toLocaleString()} lines · {res.billsN.toLocaleString()} bills</span>{res.months.length>1&&<span className="chip amber">{res.months.length} months</span>}</div>
      {(res.unB.length>0||res.unP.length>0) && <div className="err">Not matched — lines are stored, but these are left out of the KPIs until you set their Juleb name in Team and press ↻ Recalculate: {[...res.unB,...res.unP].join(" · ")}</div>}
      <div className="grid g2">
        <div><h3 style={{marginBottom:6}}>In this file · {t.branches}</h3><table><tbody>
          {Object.entries(res.sales).sort((a,b)=>b[1]-a[1]).map(([n,v])=><tr key={n}><td>{bByJ(n)?.name||<span className="chip bad">{n}</span>}</td><td className="num">{fmt(v)}</td></tr>)}</tbody></table></div>
        <div><h3 style={{marginBottom:6}}>In this file · registration</h3><table><tbody>
          {Object.entries(res.reg).sort((a,b)=>b[1].r/b[1].n-a[1].r/a[1].n).map(([n,x])=><tr key={n}><td>{n}</td><td className="num"><span className={"pct "+tone(x.r/x.n/0.7)} style={{fontSize:14}}>{(x.r/x.n*100).toFixed(1)}%</span> <span className="muted small">{x.r}/{x.n}</span></td></tr>)}</tbody></table></div>
      </div>
      <div className="row"><button className="btn" disabled={!!busy} onClick={save}>Save {res.rowsN.toLocaleString()} lines & update KPIs</button><button className="btn sec" disabled={!!busy} onClick={()=>setRes(null)}>{t.cancel}</button></div>
    </>}
    {done && <div className="grid" style={{gap:6}}>{done.map(d=><div key={d.month} className="row small"><span className="chip">✓ {String(d.month).slice(0,7)} · month-to-date as of {d.as_of}</span><span className="chip grey">{d.rows} KPI readings</span>
      {(d.unmatched||[]).length>0&&<span className="chip bad">Not matched: {d.unmatched.join(" · ")}</span>}</div>)}</div>}
  </div>;
}
/* ================= DATA (admin): snapshots ================= */

      <table><tbody>{hist.rows.map(s=><tr key={s.id}><td>{s.as_of}</td><td className="num">{s.kpi_code==="registration"?`${fmt(s.numerator)} / ${fmt(s.denominator)}`:fmt(s.value)}</td><td className="small muted">{s.source}</td><td>{me.is_super&&<button className="btn warn" style={{padding:"3px 8px"}} onClick={()=>del(s.id)}>×</button>}</td></tr>)}</tbody></table></div>}
  </div>;

/* ================= PROFILE (everyone) ================= */
function Profile({t,me,D,lang,toast,setMe}){
  const rec=D.pharmacists.find(p=>p.id===me.pharmacist_id); const [phone,setPhone]=useState(me.phone||rec?.phone||""); const [docs,setDocs]=useState([]); const [photo,setPhoto]=useState(null); const [busy,setBusy]=useState(false); const [kind,setKind]=useState("cv");
  const loadDocs=useCallback(async()=>{ const r=await sb.from("staff_documents").select("*").eq("profile_id",me.id).order("created_at",{ascending:false}); setDocs(r.data||[]); },[me.id]);
  useEffect(()=>{ loadDocs(); },[loadDocs]);
  useEffect(()=>{ (async()=>{ if(!me.photo_path){setPhoto(null);return;} const r=await sb.storage.from("staff").createSignedUrl(me.photo_path,3600); setPhoto(r.data?.signedUrl||null); })(); },[me.photo_path]);
  const savePhone=async()=>{ const r=await sb.from("profiles").update({phone}).eq("id",me.id).select().single(); toast(r.error?r.error.message:t.saved); if(!r.error) setMe(r.data); };
  const upPhoto=async e=>{ const f=e.target.files[0]; if(!f) return; setBusy(true); const ext=f.name.split(".").pop().toLowerCase(); const path=`${me.id}/photo.${ext}`;
    const u=await sb.storage.from("staff").upload(path,f,{upsert:true,contentType:f.type}); if(u.error){ toast(u.error.message); setBusy(false); return; }
    const r=await sb.from("profiles").update({photo_path:path}).eq("id",me.id).select().single(); toast(r.error?r.error.message:t.saved); if(!r.error) setMe(r.data); setBusy(false); };
  const upDoc=async e=>{ const f=e.target.files[0]; if(!f) return; setBusy(true); const path=`${me.id}/docs/${Date.now()}_${f.name.replace(/[^\w.\-]+/g,"_")}`;
    const u=await sb.storage.from("staff").upload(path,f,{contentType:f.type}); if(u.error){ toast(u.error.message); setBusy(false); return; }
    const r=await sb.from("staff_documents").insert({profile_id:me.id,kind,name:f.name,path,size:f.size}); toast(r.error?r.error.message:t.saved); loadDocs(); setBusy(false); e.target.value=""; };
  const openDoc=async d=>{ const r=await sb.storage.from("staff").createSignedUrl(d.path,600); if(r.data?.signedUrl) window.open(r.data.signedUrl,"_blank"); else toast(r.error?.message||"—"); };
  const delDoc=async d=>{ if(!confirm(t.remove+"?")) return; await sb.storage.from("staff").remove([d.path]); const r=await sb.from("staff_documents").delete().eq("id",d.id); toast(r.error?r.error.message:t.saved); loadDocs(); };
  const kinds={cv:t.docCv,certificate:t.docCert,id:t.docId,other:t.docOther};
  return <div className="grid"><h1>{t.profile}</h1>
    <div className="card row" style={{gap:20,alignItems:"flex-start"}}>
      <div style={{textAlign:"center"}}><div style={{width:120,height:120,borderRadius:"50%",background:"var(--teal-soft)",overflow:"hidden",display:"grid",placeItems:"center",fontSize:40,color:"var(--teal)"}}>{photo?<img src={photo} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:(me.full_name||"?")[0]}</div>
        <label className="btn sec" style={{display:"inline-block",marginTop:10,padding:"6px 12px",cursor:"pointer"}}>{t.changePhoto}<input type="file" accept="image/*" onChange={upPhoto} style={{display:"none"}} disabled={busy}/></label></div>
      <div className="grid" style={{flex:1,minWidth:240}}>
        <div><strong style={{fontSize:18}}>{me.full_name}</strong><div className="muted small">{rec?.title||t[me.role]} · {rec?bname(D.branches,rec.branch_id):"—"}{rec?.emp_code&&<> · {t.empCode} {rec.emp_code}</>}</div></div>
        <label className="f">{t.email}<input value={me.email||""} readOnly dir="ltr"/></label>
        <div className="row" style={{alignItems:"flex-end"}}><label className="f">{t.phone}<input value={phone} onChange={e=>setPhone(e.target.value)} dir="ltr" inputMode="tel"/></label><button className="btn" onClick={savePhone} disabled={phone===(me.phone||"")}>{t.save}</button></div>
      </div></div>
    <div className="card grid"><h2>{t.documents}</h2>
      <div className="row"><select value={kind} onChange={e=>setKind(e.target.value)} style={{width:"auto"}}>{Object.entries(kinds).map(([k,l])=><option key={k} value={k}>{l}</option>)}</select>
        <label className="btn sec" style={{cursor:"pointer"}}>{t.upload}<input type="file" accept="application/pdf,image/*" onChange={upDoc} style={{display:"none"}} disabled={busy}/></label><span className="muted small">{t.docHint}</span></div>
      {docs.length===0? <div className="empty">—</div> :
      <table><tbody>{docs.map(d=><tr key={d.id}><td><span className="chip">{kinds[d.kind]}</span></td><td><a href="#" onClick={e=>{e.preventDefault();openDoc(d);}}>{d.name}</a></td><td className="small muted">{d.created_at.slice(0,10)}</td><td className="small muted">{d.size?Math.round(d.size/1024)+" KB":""}</td><td><button className="btn warn" style={{padding:"3px 8px"}} onClick={()=>delDoc(d)}>×</button></td></tr>)}</tbody></table>}
    </div>
  </div>;
}

/* ================= APP ================= */
function App(){
  const [lang,setLang]=useState(localStorage.getItem("lang")||"en"); const t=T[lang];
  useEffect(()=>{ document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr"; localStorage.setItem("lang",lang); },[lang]);
  const [session,setSession]=useState(undefined); const [me,setMe]=useState(null); const [D,setD]=useState(null);
  const [page,setPage]=useState("dash"); const [msg,setMsg]=useState("");
  const toast=m=>{ setMsg(m); if(m!==t.saved) console.error(m); setTimeout(()=>setMsg(""), m===t.saved?2200:7000); };
  useEffect(()=>{ sb.auth.getSession().then(({data})=>setSession(data.session)); const {data:sub}=sb.auth.onAuthStateChange((_,s)=>setSession(s)); return ()=>sub.subscription.unsubscribe(); },[]);
  const reload=useCallback(async()=>{
    const [b,p,a,k,tg,sn,vi,vs,sc]=await Promise.all([
      sb.from("branches").select("*").eq("active",true).order("name"), sb.from("pharmacists").select("*").order("full_name"),
      sb.from("pharmacist_assignments").select("*"), sb.from("kpis").select("*").order("sort"), sb.from("targets").select("*"),
      sb.from("v_latest_snapshots").select("*"), sb.from("visit_items").select("*").order("sort"), sb.from("visits").select("*").order("visit_date",{ascending:false}).limit(2000), sb.from("kpi_periods").select("*")]);
    const err=[b,p,a,k,tg,sn,vi,vs,sc].find(r=>r.error); if(err) toast(err.error.message);
    // optional tables — the page still works if they don't exist yet
    const [pc,qs,qr,pl]=await Promise.all([
      sb.from("pace_calendar").select("day,weight"), sb.from("quarter_summary").select("*"), sb.from("quarter_results").select("*"), sb.from("private_label_items").select("product_ref")]);
    setD({branches:b.data||[],pharmacists:p.data||[],assignments:a.data||[],kpis:k.data||[],targets:tg.data||[],snaps:sn.data||[],visit_items:vi.data||[],visits:vs.data||[],schemes:sc.data||[],
          pace:pc.error?[]:(pc.data||[]), qsum:qs.error?[]:(qs.data||[]), qres:qr.error?[]:(qr.data||[]), plItems:pl.error?[]:(pl.data||[])});
  },[]);
  useEffect(()=>{ if(!session){setMe(null);setD(null);return;} (async()=>{ const r=await sb.from("profiles").select("*").eq("id",session.user.id).single(); setMe(r.data||null); await reload(); })(); },[session]);
  const E=useMemo(()=>D?makeEngine(D):null,[D]);

  if(session===undefined) return null;
  if(!session) return <Login t={t} lang={lang} setLang={setLang}/>;
  if(!me||!D) return <div className="empty">…</div>;
  const linked = me.role!=="pharmacist" || !!me.pharmacist_id;
  // tab visibility: super admin sees everything; others follow the page_access matrix (Admin → Settings)
  const can=k=> me.is_super&&me.role==="admin"? true : (me.pages||[]).includes(k);
  const GROUPS=[["dash",t.dash,["dash"]],["visits",t.visits,["visits","visitReports"]],["data",t.data,["data"]]];
  const tabs=GROUPS.filter(g=>g[2].some(can)).map(g=>[g[0],g[1]]);
  const firstAllowed=GROUPS.flatMap(g=>g[2]).find(can);
  const group=GROUPS.find(g=>g[2].includes(page))?.[0]||""; const subs=(GROUPS.find(g=>g[0]===group)?.[2]||[]).filter(can);
  const props={t,me,D,E,toast,lang,reload};
  return <>
    <div className="bar">
      <a className="home" href="./index.html"><span style={{fontSize:18}}>‹</span><span style={{fontWeight:600}}>{t.home}</span></a>
      <div className="brand">{t.app} <span>{t.kpi}</span></div>
      <div className="tabs">{linked && tabs.map(([k,l])=><button key={k} className={"tab"+(group===k?" on":"")} onClick={()=>setPage(GROUPS.find(g=>g[0]===k)[2].filter(can)[0])}>{l}</button>)}</div>
      <button className="who" style={{background:"transparent",border:0,cursor:"pointer"}} onClick={()=>setPage("profile")} title={t.profile}>{me.full_name} · {me.is_super?t.superAdmin:(t[me.role]||me.role)}</button>
      <button className="ghost" onClick={()=>setLang(lang==="en"?"ar":"en")}>{t.lang}</button><button className="ghost" onClick={()=>sb.auth.signOut()}>{t.out}</button></div>
    <div className="wrap">{!linked&&page!=="profile" ? <div className="card empty">{t.notLinkedMsg}<div style={{marginTop:10}}><button className="btn sec" onClick={()=>setPage("profile")}>{t.profile}</button></div></div> : !firstAllowed ? <div className="card empty">{t.noAccess}</div> : (page!=="profile"&&!can(page)) ? (setPage(firstAllowed),null) : <>
      {subs.length>1 && <div className="subtabs" style={{marginBottom:14}}>{subs.map(k=><button key={k} className={page===k?"on":""} onClick={()=>setPage(k)}>{t[k]}</button>)}</div>}
      {page==="dash"     && <Dashboard key={me.id} {...props}/>}
      {page==="visits"   && can("visits")   && <Visits {...props}/>}
      {page==="visitReports" && can("visitReports") && <VisitReports {...props}/>}
      {page==="profile" && <Profile {...props} setMe={setMe}/>}
      {page==="data"     && can("data")     && <Data {...props}/>}
</>}</div>
    <Toast msg={msg}/>
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
